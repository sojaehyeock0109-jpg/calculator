
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공학 계산기</title>

<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

<script>
window.MathJax = {
  tex: {
    inlineMath: [["$", "$"], ["\\(", "\\)"]],
    displayMath: [["$$", "$$"], ["\\[", "\\]"]]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  color: #172033;
  background: #f2f5fb;
}

.layout {
  max-width: 1450px;
  margin: auto;
  display: grid;
  grid-template-columns: minmax(300px, .9fr) minmax(360px, 1.1fr);
  gap: 22px;
  align-items: start;
}

.panel {
  min-width: 0;
  padding: 24px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 24px #1720330c;
}

h1 { font-size: 25px; margin: 0 0 10px; }

p { line-height: 1.65; }

.muted, .examples {
  color: #64748b;
  font-size: 14px;
  line-height: 1.9;
}

input, textarea, button { font: inherit; }

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  color: #172033;
  background: white;
}

button {
  padding: 11px 14px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}

.primary { color: white; background: #2563eb; }
.secondary { color: #334155; background: #e9eef6; }

.editor {
  min-height: 180px;
  padding: 10px;
  border: 1px solid #dbe3ee;
  border-radius: 12px;
}

#mathInput {
  min-height: 155px;
  padding: 10px;
  border: 0;
  outline: none;
  resize: vertical;
  box-shadow: none;
  font-size: 21px;
  line-height: 1.7;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.keyboard-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin: 20px 0 12px;
}

.tabs, .angles { display: flex; gap: 5px; }

.tab, .angle {
  padding: 8px 11px;
  background: #f1f5f9;
  color: #64748b;
}

.tab.active { background: #eaf1ff; color: #2563eb; }
.angle.active { background: #475569; color: white; }

.key-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
}

.key {
  min-width: 0;
  min-height: 43px;
  padding: 7px 2px;
  background: #edf1f7;
  border: 1px solid #dce3ed;
  color: #1e293b;
}

.key.operator { color: #1d4ed8; background: #e8f0ff; }
.key.func { color: #6d28d9; background: #f1eafe; }

.key-footer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.hint {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: #f8fafc;
  color: #64748b;
  font-size: 13px;
  line-height: 1.75;
}

/* 오른쪽: 입력 한 번, 계산 한 번, 결과 한 곳 */
#rightInput { margin-top: 16px; }

.result {
  min-height: 125px;
  margin-top: 22px;
  padding: 20px;
  border-radius: 12px;
  background: #eff6ff;
  overflow-wrap: anywhere;
}

#formula {
  color: #526581;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#answer {
  font-size: 16px;
  line-height: 1.9;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

#answer mjx-container {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

.status { font-weight: 700; }

.example {
  display: block;
  padding: 3px 0;
  color: #526581;
  background: transparent;
  text-align: left;
}

.example:hover { color: #2563eb; }

@media (max-width: 950px) {
  body { padding: 12px; }
  .layout { grid-template-columns: 1fr; }
  .panel { padding: 18px; }
}

@media (max-width: 450px) {
  .panel { padding: 16px; }
  .key-grid { gap: 5px; }
  .key { min-height: 39px; font-size: 14px; }
}
</style>
</head>

<body>
<div class="layout">

<!-- 왼쪽 수식 입력기 -->
<section class="panel">
  <h1>수식 입력기</h1>
  <p class="muted">수식과 방정식을 입력하고 계산하세요.</p>

  <div class="editor">
    <textarea id="mathInput"
      placeholder="예: sqrt(16) + 3^2&#10;또는 x^2 + 4 = 16"
      aria-label="수식 입력"
      spellcheck="false"></textarea>
  </div>

  <div class="actions">
    <button class="primary" id="calculateLeft" type="button">
      수식 계산하기
    </button>
  </div>

  <div class="keyboard-head">
    <div class="tabs">
      <button class="tab active" data-tab="main" type="button">주요</button>
      <button class="tab" data-tab="letters" type="button">문자</button>
      <button class="tab" data-tab="functions" type="button">함수</button>
    </div>

    <div class="angles">
      <button class="angle active" id="degButton" type="button">DEG</button>
      <button class="angle" id="radButton" type="button">RAD</button>
    </div>
  </div>

  <div id="keyGrid" class="key-grid"></div>

  <div class="key-footer">
    <button class="secondary" id="backspaceButton" type="button">⌫ 지우기</button>
    <button class="secondary" id="clearButton" type="button">AC 전체 지우기</button>
  </div>

  <div class="hint">
    <strong>입력 예시</strong><br>
    <code>2 + 3 * 5</code><br>
    <code>sqrt(16)</code><br>
    <code>x^2 + 4 = 16</code><br>
    <code>2*x + 3 = 7</code>
  </div>
</section>

<!-- 오른쪽: 일반 입력창과 계산 버튼, 결과 화면 -->
<section class="panel">
  <h1>공학 계산기</h1>
  <p class="muted">
    수식이나 간단한 자연어 수학 표현을 입력하세요.
  </p>

  <form id="calcForm">
    <input id="rightInput"
      placeholder="예: x제곱 더하기 4 = 16"
      autocomplete="off">

    <div class="actions">
      <button class="primary" type="submit">계산하기</button>
    </div>
  </form>

  <div class="examples">
    <strong>입력 예시</strong><br>
    <button class="example" data-example="루트 16" type="button">루트 16</button>
    <button class="example" data-example="3의 제곱 더하기 2" type="button">3의 제곱 더하기 2</button>
    <button class="example" data-example="2의3제곱" type="button">2의3제곱</button>
    <button class="example" data-example="사인 30도 더하기 코사인 60도" type="button">사인 30도 더하기 코사인 60도</button>
    <button class="example" data-example="x제곱 더하기 4 = 16" type="button">x제곱 더하기 4 = 16</button>
    <button class="example" data-example="2*x + 3 = 7" type="button">2*x + 3 = 7</button>
  </div>

  <section class="result" aria-live="polite">
    <strong class="status" id="status">계산 결과가 여기에 표시됩니다.</strong>
    <p id="formula"></p>
    <div id="answer"></div>
  </section>

  <div class="hint">
    AI API를 호출하지 않습니다. 지원하지 않는 수식이나 방정식은 오류 메시지로 알려 줍니다.
  </div>
</section>

</div>

<script>
const mathInput = document.getElementById("mathInput");
const rightInput = document.getElementById("rightInput");
const calcForm = document.getElementById("calcForm");
const statusText = document.getElementById("status");
const formulaText = document.getElementById("formula");
const answerText = document.getElementById("answer");
const keyGrid = document.getElementById("keyGrid");

let angleMode = "deg";

function showResult(status, formula = "", answer = "") {
  if (window.MathJax?.typesetClear) {
    window.MathJax.typesetClear([answerText]);
  }

  statusText.textContent = status;
  formulaText.textContent = formula;
  answerText.textContent = answer;
}

async function renderMath() {
  if (window.MathJax?.typesetPromise) {
    try {
      await window.MathJax.typesetPromise([answerText]);
    } catch {}
  }
}

function normalizeExpression(raw) {
  if (raw.length > 300) {
    throw new Error("수식은 300자 이하여야 합니다.");
  }

  let s = raw.trim().toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-")
    .replace(/²/g, "^2")
    .replace(/³/g, "^3");

  // 자연어 수학 표현 변환
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*제곱/g,
    "($1^2)"
  );

  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const words = [
    ["자연로그", "ln"], ["제곱근", "sqrt"],
    ["코사인", "cos"], ["탄젠트", "tan"],
    ["사인", "sin"], ["세제곱", "^3"],
    ["제곱", "^2"], ["루트", "sqrt"],
    ["로그", "log"], ["파이", "pi"],
    ["더하기", "+"], ["플러스", "+"],
    ["빼기", "-"], ["마이너스", "-"],
    ["곱하기", "*"], ["나누기", "/"],
    ["계산해 주세요", ""], ["계산해줘", ""],
    ["구해 주세요", ""], ["구해줘", ""],
    ["의", ""], ["도", ""]
  ];

  for (const [word, replacement] of words) {
    s = s.split(word).join(replacement);
  }

  s = s.replace(
    /\b(sqrt|sin|cos|tan|log|ln)\s+([+-]?\d+(?:\.\d+)?)/g,
    "$1($2)"
  );

  return s.trim();
}

const knownNames = new Set([
  "sqrt", "sin", "cos", "tan", "log", "ln", "pi", "e"
]);

function validateNumericExpression(s) {
  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(s)) {
    throw new Error("지원하지 않는 문자가 포함되어 있습니다.");
  }

  const identifiers = s.match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [];

  const unknown = identifiers.filter(name => !knownNames.has(name));

  if (unknown.length) {
    throw new Error("미지수가 포함되어 있습니다. 방정식은 = 기호를 입력해 주세요.");
  }
}

function prepareTrig(s) {
  if (angleMode !== "deg") return s;

  return s.replace(
    /\b(sin|cos|tan)\(([^()]*)\)/g,
    (all, fn, arg) => {
      if (/^[0-9.+\-*/\s]+$/.test(arg)) {
        return `${fn}((${arg})*pi/180)`;
      }
      return all;
    }
  );
}

function formatNumber(value) {
  if (!Number.isFinite(value)) {
    throw new Error("유효한 숫자 결과가 아닙니다.");
  }

  if (Math.abs(value) < 1e-12) return "0";
  return Number(value.toPrecision(10)).toString();
}

function evaluateNumeric(raw) {
  const normalized = prepareTrig(normalizeExpression(raw));

  if (!normalized) throw new Error("수식을 입력해 주세요.");
  if (normalized.includes("=")) {
    throw new Error("방정식은 등호를 포함해 입력해 주세요.");
  }

  validateNumericExpression(normalized);

  let value;

  try {
    value = Number(
      window.nerdamer(normalized).evaluate().text("decimals")
    );
  } catch {
    throw new Error("수식을 계산하지 못했습니다. 연산자와 괄호를 확인해 주세요.");
  }

  return {
    normalized,
    value: formatNumber(value)
  };
}

function splitRoots(text) {
  let s = String(text).trim();

  if (
    (s.startsWith("{") && s.endsWith("}")) ||
    (s.startsWith("[") && s.endsWith("]"))
  ) {
    s = s.slice(1, -1);
  }

  const parts = [];
  let current = "";
  let depth = 0;

  for (const ch of s) {
    if ("([{".includes(ch)) depth++;
    if (")] }".replace(/ /g, "").includes(ch)) depth--;

    if (ch === "," && depth === 0) {
      if (current.trim()) parts.push(current.trim());
      current = "";
    } else {
      current += ch;
    }
  }

  if (current.trim()) parts.push(current.trim());
  return parts;
}

function solveEquation(raw) {
  const normalized = normalizeExpression(raw);

  if ((normalized.match(/=/g) || []).length !== 1) {
    throw new Error("등호가 하나인 방정식만 지원합니다.");
  }

  const [left, right] = normalized.split("=").map(s => s.trim());

  if (!left || !right) {
    throw new Error("등호 양쪽에 식을 입력해 주세요.");
  }

  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(left + right)) {
    throw new Error("방정식에 지원하지 않는 문자가 포함되어 있습니다.");
  }

  const identifiers =
    (left + " " + right).match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [];

  const variables = [...new Set(
    identifiers.filter(name => !knownNames.has(name))
  )];

  if (variables.length !== 1) {
    throw new Error(
      variables.length === 0
        ? "방정식에서 미지수를 찾지 못했습니다."
        : "현재는 미지수가 하나인 방정식만 지원합니다."
    );
  }

  const variable = variables[0];
  const equation = `(${left})-(${right})`;

  let solution;

  try {
    solution = window.nerdamer.solve(equation, variable);
  } catch {
    throw new Error("이 방정식의 해를 구하지 못했습니다.");
  }

  const roots = splitRoots(String(solution))
    .filter(root => root && !/unsolved|undefined|NaN/i.test(root));

  if (!roots.length) {
    throw new Error("해를 찾지 못했습니다. 방정식 형식을 확인해 주세요.");
  }

  const exact = [];
  const approximate = [];

  for (const root of roots) {
    try {
      const expression = window.nerdamer(root);
      exact.push(`\\(${variable} = ${expression.toTeX()}\\)`);

      const numeric = Number(expression.evaluate().text("decimals"));

      if (Number.isFinite(numeric)) {
        approximate.push(`\\(${variable} \\approx ${formatNumber(numeric)}\\)`);
      }
    } catch {
      exact.push(`\\(${variable} = ${root}\\)`);
    }
  }

  let answer = "정확한 해:\n" + [...new Set(exact)].join("\n");

  if (approximate.length) {
    answer += "\n\n소수 근삿값:\n" + [...new Set(approximate)].join("\n");
  }

  return { normalized, answer };
}

async function calculate(raw) {
  try {
    const expression = raw.trim();

    if (!expression) {
      throw new Error("수식을 입력해 주세요.");
    }

    if (expression.includes("=")) {
      const result = solveEquation(expression);

      showResult(
        "방정식 풀이 완료",
        "입력한 방정식: " + result.normalized,
        result.answer
      );

      await renderMath();
      return;
    }

    const result = evaluateNumeric(expression);

    showResult(
      "계산 완료",
      "변환한 수식: " + result.normalized,
      `\\[${result.normalized} = ${result.value}\\]`
    );

    await renderMath();
  } catch (error) {
    showResult("계산할 수 없습니다.", error.message, "");
  }
}

// 오른쪽: 계산 버튼을 누르면 한 곳에 결과 표시
calcForm.addEventListener("submit", event => {
  event.preventDefault();
  calculate(document.getElementById("rightInput").value);
});

// 왼쪽: 같은 결과창을 사용하며 입력은 그대로 유지
document.getElementById("calculateLeft").addEventListener("click", () => {
  calculate(mathInput.value);
});

// 빠른 예시는 오른쪽 입력창에 채워 넣기만 합니다.
document.querySelectorAll(".example").forEach(button => {
  button.addEventListener("click", () => {
    document.getElementById("rightInput").value = button.dataset.example;
  });
});

// 키패드 설정
const layouts = {
  main: [
    ["(", "("], [")", ")"], ["x²", "^2"], ["xʸ", "^"], ["√", "sqrt("],
    ["7","7"],["8","8"],["9","9"],["÷","/"],["a/b","()/()",1],
    ["4","4"],["5","5"],["6","6"],["×","*"],["π","pi"],
    ["1","1"],["2","2"],["3","3"],["−","-"],["+","+"],
    ["0","0"],[".","."],["sin","sin("],["cos","cos("],["tan","tan("],
    ["x","x"],["=","="],["y","y"],["z","z"],["^3","^3"]
  ],
  letters: [
    ["x","x"],["y","y"],["z","z"],["a","a"],["b","b"],
    ["c","c"],["m","m"],["t","t"],["V","V"],["I","I"],
    ["R","R"],["P","P"],["L","L"],["C","C"],["F","F"],
    ["(","("],[")",")"],["=","="],["+","+"],["−","-"],
    ["×","*"],["÷","/"],["^","^"],["π","pi"],[".","."]
  ],
  functions: [
    ["sin(","sin("],["cos(","cos("],["tan(","tan("],
    ["√","sqrt("],["log(","log("],["ln(","ln("],
    ["π","pi"],["e","e"],["x²","^2"],["xʸ","^"],
    ["(","("],[")",")"],["=","="],["+","+"],["−","-"],
    ["×","*"],["÷","/"],["a/b","()/()",1],["x","x"],["^3","^3"]
  ]
};

function insertAtCursor(text, offset) {
  const start = mathInput.selectionStart ?? mathInput.value.length;
  const end = mathInput.selectionEnd ?? mathInput.value.length;

  mathInput.setRangeText(text, start, end, "end");

  const caret = start + (
    Number.isInteger(offset) ? offset : text.length
  );

  mathInput.focus();
  mathInput.setSelectionRange(caret, caret);
}

function renderKeys(tab) {
  keyGrid.replaceChildren();

  for (const [label, value, offset] of layouts[tab]) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "key";

    if (["+", "-", "*", "/", "^", "="].includes(value)) {
      button.classList.add("operator");
    }

    if (["sqrt(", "sin(", "cos(", "tan(", "pi", "log(", "ln("].includes(value)) {
      button.classList.add("func");
    }

    button.textContent = label;
    button.addEventListener("click", () => insertAtCursor(value, offset));
    keyGrid.appendChild(button);
  }

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => renderKeys(button.dataset.tab));
});

document.getElementById("clearButton").addEventListener("click", () => {
  mathInput.value = "";
  mathInput.focus();
});

document.getElementById("backspaceButton").addEventListener("click", () => {
  const start = mathInput.selectionStart;
  const end = mathInput.selectionEnd;

  if (start !== end) {
    mathInput.setRangeText("", start, end, "end");
  } else if (start > 0) {
    mathInput.setRangeText("", start - 1, end, "end");
  }

  mathInput.focus();
});

document.getElementById("degButton").addEventListener("click", () => {
  angleMode = "deg";
  document.getElementById("degButton").classList.add("active");
  document.getElementById("radButton").classList.remove("active");
});

document.getElementById("radButton").addEventListener("click", () => {
  angleMode = "rad";
  document.getElementById("radButton").classList.add("active");
  document.getElementById("degButton").classList.remove("active");
});

renderKeys("main");
</script>
</body>
</html>
