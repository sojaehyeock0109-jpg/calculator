
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공학용 계산기</title>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 1100px; margin: auto; }
    h1 { font-size: 25px; }
    .layout {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      padding: 18px;
      background: white;
      border: 1px solid #dfe5ee;
      border-radius: 15px;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 13px;
      border: 1px solid #dfe5ee;
      border-radius: 10px;
      font-size: 19px;
      resize: vertical;
    }
    button {
      padding: 11px;
      border: 1px solid #dfe5ee;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #edf2f8; }
    .primary, .equal {
      color: white;
      background: #2563eb;
      border-color: #2563eb;
    }
    .actions { display: flex; gap: 8px; margin: 10px 0 14px; }
    .actions button:last-child { flex: 1; }
    .keys {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .keys button { min-height: 45px; }
    .op { background: #eff5ff; color: #1d4ed8; }
    .history-item {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #dfe5ee;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    .history-expression {
      color: #667085;
      font-size: 14px;
      white-space: pre-wrap;
      margin-bottom: 7px;
    }
    .history-result { white-space: pre-wrap; font-size: 16px; }
    .history-actions { text-align: right; margin-top: 8px; }
    .history-actions button { font-size: 12px; padding: 5px 8px; }
    .empty { color: #667085; padding: 16px 0; }
    .error { color: #b42318; }
    @media (max-width: 760px) {
      body { padding: 12px; }
      .layout { grid-template-columns: 1fr; }
      .keys { gap: 5px; }
      .keys button { padding: 8px 2px; font-size: 13px; }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>공학용 계산기</h1>

  <div class="layout">
    <section class="panel">
      <textarea id="expression" placeholder="계산식 또는 방정식 입력"></textarea>

      <div class="actions">
        <button id="clear">초기화</button>
        <button id="backspace">지우기</button>
        <button class="primary" id="calculate">계산</button>
      </div>

      <div class="keys" id="keys">
        <button data-insert="7">7</button>
        <button data-insert="8">8</button>
        <button data-insert="9">9</button>
        <button class="op" data-insert="/">÷</button>
        <button class="op" data-insert="(">(</button>

        <button data-insert="4">4</button>
        <button data-insert="5">5</button>
        <button data-insert="6">6</button>
        <button class="op" data-insert="*">×</button>
        <button class="op" data-insert=")">)</button>

        <button data-insert="1">1</button>
        <button data-insert="2">2</button>
        <button data-insert="3">3</button>
        <button class="op" data-insert="-">−</button>
        <button class="op" data-insert="^">xʸ</button>

        <button data-insert="0">0</button>
        <button data-insert=".">.</button>
        <button data-insert="x">x</button>
        <button class="op" data-insert="+">+</button>
        <button class="equal" data-action="calculate">=</button>

        <button data-insert="sqrt(">√</button>
        <button data-insert="pi">π</button>
        <button data-insert="sin(">sin</button>
        <button data-insert="cos(">cos</button>
        <button data-insert="tan(">tan</button>

        <button data-insert="log(">log</button>
        <button data-insert="ln(">ln</button>
        <button data-insert="abs(">abs</button>
        <button data-insert="^2">x²</button>
        <button data-insert="^3">x³</button>
      </div>
    </section>

    <aside class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2 style="margin:0;font-size:19px">계산 기록</h2>
        <button id="clearHistory">기록 삭제</button>
      </div>
      <div id="history" class="empty">아직 계산 기록이 없습니다.</div>
    </aside>
  </div>
</div>

<script>
(() => {
  const input = document.getElementById("expression");
  const historyBox = document.getElementById("history");
  const records = [];

  // 한글 숫자를 숫자로 변환
  function koreanNumber(word) {
    const digits = {
      영:0, 공:0, 일:1, 이:2, 삼:3, 사:4,
      오:5, 육:6, 륙:6, 칠:7, 팔:8, 구:9
    };
    const units = { 십:10, 백:100, 천:1000 };

    if (/^[영공일이삼사오육륙칠팔구]+$/.test(word)) {
      return String(Number([...word].map(c => digits[c]).join("")));
    }

    let total = 0;
    let current = 0;

    for (const c of word) {
      if (c in digits) {
        current = digits[c];
      } else if (c in units) {
        total += (current || 1) * units[c];
        current = 0;
      } else {
        return word;
      }
    }
    return String(total + current);
  }

  // 한국어 표현을 수식으로 변환
  function normalize(raw) {
    let s = raw.trim().toLowerCase();

    s = s.replace(/엑스/g, "x");
    s = s.replace(/파이/g, "pi");

    s = s.replace(/더하기/g, "+");
    s = s.replace(/빼기/g, "-");
    s = s.replace(/곱하기/g, "*");
    s = s.replace(/나누기/g, "/");

    s = s.replace(/의\s*세제곱/g, "^3");
    s = s.replace(/의\s*제곱/g, "^2");
    s = s.replace(/세제곱/g, "^3");
    s = s.replace(/제곱/g, "^2");

    s = s.replace(/은|는/g, "=");
    s = s.replace(/÷/g, "/").replace(/×/g, "*").replace(/π/g, "pi");

    // 한글 숫자 변환: 연산자와 괄호 사이의 숫자를 인식
    const words = "영공일이삼사오육륙칠팔구십백천";
    const re = new RegExp(
      "[" + words + "]+(?=$|[+*/^()=\\-])",
      "g"
    );
    s = s.replace(re, koreanNumber);

    // 숫자와 변수 사이의 곱셈 기호 처리
    s = s.replace(/\s+/g, "");
    s = s.replace(/(\d)(x|pi|\()/g, "$1*$2");
    s = s.replace(/(x|pi|\))(\d|x|pi|\()/g, "$1*$2");

    return s;
  }

  function solveEquation(left, right) {
    // x를 포함한 양변을 0이 되는 식으로 정리
    const equation = "(" + left + ")-(" + right + ")";

    // Solve.js가 로드되었는지 확인
    if (typeof nerdamer.solve !== "function") {
      throw new Error(
        "방정식 풀이 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요."
      );
    }

    const solved = nerdamer.solve(equation, "x");
    let roots = [];

    if (Array.isArray(solved)) {
      roots = solved.map(String);
    } else if (solved && typeof solved.each === "function") {
      solved.each(root => roots.push(String(root)));
    } else if (solved !== undefined && solved !== null) {
      const text = String(solved);
      roots = text.startsWith("[") && text.endsWith("]")
        ? text.slice(1, -1).split(",").map(v => v.trim()).filter(Boolean)
        : [text];
    }

    if (!roots.length) {
      return "해를 찾지 못했습니다.";
    }

    return roots.map((root, i) => {
      let line = "x" + (roots.length > 1 ? (i + 1) : "") + " = " + root;
      try {
        const decimal = nerdamer(root).evaluate().text("decimals", 10);
        if (decimal && decimal !== root && !/NaN|Infinity/.test(decimal)) {
          line += "  (≈ " + decimal + ")";
        }
      } catch (_) {}
      return line;
    }).join("\n");
  }

  function calculate() {
    const raw = input.value.trim();
    if (!raw) return;

    try {
      if (typeof nerdamer !== "function") {
        throw new Error("계산 라이브러리를 불러오지 못했습니다.");
      }

      const expression = normalize(raw);
      let result;

      if (expression.includes("=")) {
        const parts = expression.split("=");
        if (parts.length !== 2 || !parts[0] || !parts[1]) {
          throw new Error("등호 기준으로 양쪽 식을 입력해 주세요.");
        }
        if (!/[a-z]/i.test(expression)) {
          const lhs = nerdamer(parts[0]).evaluate().toString();
          const rhs = nerdamer(parts[1]).evaluate().toString();
          result = lhs + " = " + rhs;
        } else {
          result = solveEquation(parts[0], parts[1]);
        }
      } else {
        const value = nerdamer(expression).evaluate();
        result = value.toString();

        try {
          const decimal = value.text("decimals", 10);
          if (decimal && decimal !== result && !/NaN|Infinity/.test(decimal)) {
            result += "  (≈ " + decimal + ")";
          }
        } catch (_) {}
      }

      addRecord(raw, result);
    } catch (error) {
      addRecord(raw, "오류: " + (error.message || "계산할 수 없는 식입니다."));
    }
  }

  function addRecord(expression, result) {
    records.unshift({ expression, result });
    if (records.length > 50) records.pop();
    renderHistory();
  }

  function renderHistory() {
    historyBox.replaceChildren();

    if (!records.length) {
      historyBox.className = "empty";
      historyBox.textContent = "아직 계산 기록이 없습니다.";
      return;
    }

    historyBox.className = "";
    records.forEach(record => {
      const item = document.createElement("div");
      item.className = "history-item";

      const expression = document.createElement("div");
      expression.className = "history-expression";
      expression.textContent = record.expression;

      const result = document.createElement("div");
      result.className = "history-result";
      result.textContent = record.result;
      if (record.result.startsWith("오류:")) result.classList.add("error");

      const actions = document.createElement("div");
      actions.className = "history-actions";

      const reuse = document.createElement("button");
      reuse.textContent = "다시 입력";
      reuse.addEventListener("click", () => {
        input.value = record.expression;
        input.focus();
      });

      actions.appendChild(reuse);
      item.append(expression, result, actions);
      historyBox.appendChild(item);
    });
  }

  document.getElementById("calculate").addEventListener("click", calculate);
  document.getElementById("clear").addEventListener("click", () => {
    input.value = "";
    input.focus();
  });
  document.getElementById("backspace").addEventListener("click", () => {
    input.value = input.value.slice(0, -1);
    input.focus();
  });
  document.getElementById("clearHistory").addEventListener("click", () => {
    records.length = 0;
    renderHistory();
  });

  document.getElementById("keys").addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.action === "calculate") {
      calculate();
      return;
    }

    if (button.dataset.insert) {
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.setRangeText(button.dataset.insert, start, end, "end");
      input.focus();
    }
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      calculate();
    }
  });
})();
</script>
</body>
</html>
