<style>

<body>

<script>
const AI_API_URL = "https://calculator.sojaehyeock0109.workers.dev/api/solve";

const editor = document.getElementById("formulaEditor");
const input = document.getElementById("expression");
const statusText = document.getElementById("status");
const formulaText = document.getElementById("formula");
const answerText = document.getElementById("answer");
const aiButton = document.getElementById("aiButton");
const keyGrid = document.getElementById("keyGrid");
let angleMode = "deg";

function prepareExpression(raw) {
  if (raw.length > 300) throw new Error("입력은 300자 이하여야 합니다.");

  let s = raw.toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-");

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );
  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const replacements = [
    ["자연로그", "ln"], ["제곱근", "sqrt"],
    ["코사인", "cos"], ["탄젠트", "tan"],
    ["사인", "sin"], ["세제곱", "^3"],
    ["제곱", "^2"], ["루트", "sqrt"],
    ["로그", "log"], ["파이", "pi"],
    ["더하기", "+"], ["플러스", "+"],
    ["빼기", "-"], ["마이너스", "-"],
    ["곱하기", "*"], ["나누기", "/"],
    ["의", ""], ["도", ""]
  ];

  for (const [word, replacement] of replacements) {
    s = s.split(word).join(replacement);
  }

  return s.trim();
}

function fmtNumber(n) {
  if (Math.abs(n) < 1e-12) return "0";
  return Number(n.toPrecision(7)).toString();
}

function gcd(a, b) {
  a = Math.abs(Math.round(a));
  b = Math.abs(Math.round(b));
  while (b) [a, b] = [b, a % b];
  return a || 1;
}

function rationalTex(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  n = Math.round(n / g);
  d = Math.round(d / g);

  if (d === 1) return String(n);
  return `\\frac{${n}}{${d}}`;
}

// sqrt(n)을 outside * sqrt(inside) 형태로 간단히 만듭니다.
function simplifyIntegerSqrt(n) {
  let inside = Math.round(n);
  let outside = 1;

  for (let i = 2; i * i <= inside && i <= 10000; i++) {
    while (inside % (i * i) === 0) {
      outside *= i;
      inside /= i * i;
    }
  }

  return {outside, inside};
}

function isIntegerNear(n) {
  return Math.abs(n - Math.round(n)) < 1e-8;
}

function numericExpression(expr) {
  const value = window.nerdamer(String(expr)).evaluate().text();
  const n = Number(value);

  if (!Number.isFinite(n)) {
    throw new Error("방정식의 계수를 숫자로 계산할 수 없습니다.");
  }
  return n;
}

function exactQuadraticAnswer(a, b, c, variable) {
  // 부호를 정규화합니다.
  if (a < 0) {
    a = -a; b = -b; c = -c;
  }

  const D = b * b - 4 * a * c;
  const rootD = Math.sqrt(Math.max(0, D));
  const x1 = (-b + rootD) / (2 * a);
  const x2 = (-b - rootD) / (2 * a);

  let exact;

  if (D < -1e-9) {
    // 복소근
    const real = -b / (2 * a);
    const imag = Math.sqrt(-D) / (2 * a);
    exact =
      `${variable} = \\frac{-(${fmtNumber(b)}) \\pm i\\sqrt{${fmtNumber(-D)}}}{${fmtNumber(2*a)}}`;

    return {
      exact,
      approximate:
        `${variable}_1 \\approx ${fmtNumber(real)} + ${fmtNumber(imag)}i,\\quad ` +
        `${variable}_2 \\approx ${fmtNumber(real)} - ${fmtNumber(imag)}i`
    };
  }

  // 계수와 판별식이 정수일 때 근호를 간단하게 정리합니다.
  if ([a, b, c, D].every(isIntegerNear)) {
    a = Math.round(a);
    b = Math.round(b);
    c = Math.round(c);
    const intD = Math.max(0, Math.round(D));
    const sqrtInfo = simplifyIntegerSqrt(intD);

    if (sqrtInfo.inside === 1) {
      const r1 = rationalTex(-b + sqrtInfo.outside, 2 * a);
      const r2 = rationalTex(-b - sqrtInfo.outside, 2 * a);
      exact = `${variable}_1 = ${r1},\\quad ${variable}_2 = ${r2}`;
    } else {
      const denominator = 2 * a;
      const common = gcd(gcd(b, sqrtInfo.outside), denominator);
      const base = -Math.round(b / common);
      const outside = Math.round(sqrtInfo.outside / common);
      const den = Math.round(denominator / common);
      const radical = `${outside === 1 ? "" : outside}\\sqrt{${sqrtInfo.inside}}`;

      let expression;

      if (base === 0) {
        expression = outside === 1
          ? `\\sqrt{${sqrtInfo.inside}}`
          : `${outside}\\sqrt{${sqrtInfo.inside}}`;

        if (den !== 1) {
          expression = `\\frac{${outside === 1 ? `\\sqrt{${sqrtInfo.inside}}` : `${outside}\\sqrt{${sqrtInfo.inside}}`}}{${den}}`;
        }

        exact = `${variable} = \\pm ${expression}`;
      } else {
        const numerator = `${base < 0 ? `-${Math.abs(base)}` : base} \\pm ${radical}`;

        expression = den === 1
          ? numerator
          : `\\frac{${numerator}}{${den}}`;

        exact = `${variable} = ${expression}`;
      }
    }
  } else {
    // 소수 계수의 경우에도 정확한 일반 근의 공식을 보여 줍니다.
    exact =
      `${variable} = \\frac{-(${fmtNumber(b)}) \\pm \\sqrt{${fmtNumber(D)}}}{${fmtNumber(2*a)}}`;
  }

  return {
    exact,
    approximate:
      `${variable}_1 \\approx ${fmtNumber(x1)},\\quad ` +
      `${variable}_2 \\approx ${fmtNumber(x2)}`
  };
}

function solveEquation(raw) {
  const normalized = prepareExpression(raw);

  if (!normalized.includes("=")) return null;

  if ((normalized.match(/=/g) || []).length !== 1) {
    throw new Error("등호가 하나인 방정식만 지원합니다.");
  }

  const [left, right] = normalized.split("=").map(s => s.trim());

  if (!left || !right) throw new Error("등호 양쪽의 식을 확인해 주세요.");

  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(left + right)) {
    throw new Error("방정식에 지원하지 않는 문자가 있습니다.");
  }

  const ignored = new Set([
    "sqrt", "sin", "cos", "tan", "log", "ln", "pi", "e"
  ]);

  const variables = [...new Set(
    (normalized.match(/[a-zA-Z]+/g) || [])
      .map(s => s.toLowerCase())
      .filter(s => !ignored.has(s))
  )];

  if (variables.length !== 1) {
    throw new Error(
      variables.length === 0
        ? "방정식에서 미지수를 찾지 못했습니다."
        : "현재는 미지수 하나인 방정식을 지원합니다."
    );
  }

  const variable = variables[0];
  const residual = `(${left})-(${right})`;

  // 먼저 다항식 계수를 추출해 일차·이차방정식을 정확하게 풉니다.
  try {
    const expanded = window.nerdamer(residual).expand().toString();
    const vector = window.nerdamer.coeffs(expanded, variable);
    const coefficients = vector.elements.map(item =>
      numericExpression(item.toString())
    );

    while (
      coefficients.length > 1 &&
      Math.abs(coefficients[coefficients.length - 1]) < 1e-10
    ) {
      coefficients.pop();
    }

    const degree = coefficients.length - 1;

    if (degree === 1) {
      const c = coefficients[0];
      const b = coefficients[1];

      if (Math.abs(b) < 1e-12) {
        throw new Error("일차방정식의 계수가 0입니다.");
      }

      const root = -c / b;
      let exact;

      if ([b, c].every(isIntegerNear)) {
        exact = rationalTex(-Math.round(c), Math.round(b));
      } else {
        exact = fmtNumber(root);
      }

      return {
        normalized,
        display:
          `정확한 해:\n\\[${variable} = ${exact}\\]\n\n` +
          `소수 근삿값:\n\\[${variable} \\approx ${fmtNumber(root)}\\]`
      };
    }

    if (degree === 2) {
      const c = coefficients[0];
      const b = coefficients[1];
      const a = coefficients[2];
      const solved = exactQuadraticAnswer(a, b, c, variable);

      return {
        normalized,
        display:
          `정확한 해:\n\\[${solved.exact}\\]\n\n` +
          `소수 근삿값:\n\\[${solved.approximate}\\]`
      };
    }
  } catch (error) {
    if (error.message && (
      error.message.includes("계수가 0") ||
      error.message.includes("미지수")
    )) {
      throw error;
    }
    // 기호 계수 추출에 실패하면 일반 솔버로 넘어갑니다.
  }

  // 고차 방정식과 다른 지원되는 유형은 Nerdamer 솔버를 사용합니다.
  let solution;

  try {
    solution = window.nerdamer.solve(residual, variable);
  } catch {
    throw new Error("이 방정식의 해를 구하지 못했습니다.");
  }

  const roots = String(solution).trim()
    .replace(/^\{|\}$/g, "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  if (!roots.length || /unsolved|undefined|NaN/i.test(String(solution))) {
    throw new Error("해를 구하지 못했습니다.");
  }

  const exactRoots = roots.map(root => {
    try {
      return `${variable} = ${window.nerdamer(root).toTeX()}`;
    } catch {
      return `${variable} = ${root}`;
    }
  });

  const approximateRoots = roots.map(root => {
    try {
      const n = numericExpression(root);
      return Number.isFinite(n)
        ? `${variable} \\approx ${fmtNumber(n)}`
        : `${variable} = ${root}`;
    } catch {
      return `${variable} = ${root}`;
    }
  });

  return {
    normalized,
    display:
      `정확한 해:\n\\[${exactRoots.join(",\\quad ")}\\]\n\n` +
      `근삿값:\n\\[${approximateRoots.join(",\\quad ")}\\]`
  };
}

function tokenize(s) {
  const tokens = [];
  let i = 0;

  while (i < s.length) {
    if (/\s/.test(s[i])) { i++; continue; }

    const rest = s.slice(i);
    const num = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);

    if (num) {
      tokens.push({type:"number", value:Number(num[0])});
      i += num[0].length;
      continue;
    }

    const name = rest.match(/^[a-z]+/);

    if (name) {
      tokens.push({type:"name", value:name[0]});
      i += name[0].length;
      continue;
    }

    if ("+-*/^()".includes(s[i])) {
      tokens.push({type:"symbol", value:s[i++]});
      continue;
    }

    throw new Error("인식할 수 없는 문자: " + s[i]);
  }

  if (!tokens.length) throw new Error("수식을 입력해 주세요.");
  return tokens;
}

function calculateExpression(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];

  function take(v) {
    if (peek() && peek().value === v) { pos++; return true; }
    return false;
  }

  function expression() {
    let v = term();

    while (peek() && ["+", "-"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const r = term();
      v = op === "+" ? v+r : v-r;
    }
    return v;
  }

  function term() {
    let v = unary();

    while (peek() && ["*", "/"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const r = unary();

      if (op === "/" && r === 0) throw new Error("0으로 나눌 수 없습니다.");
      v = op === "*" ? v*r : v/r;
    }
    return v;
  }

  function unary() {
    if (take("+")) return unary();
    if (take("-")) return -unary();
    return power();
  }

  function power() {
    const b = primary();
    return take("^") ? Math.pow(b, unary()) : b;
  }

  function primary() {
    const t = peek();

    if (!t) throw new Error("수식이 완성되지 않았습니다.");

    if (t.type === "number") { pos++; return t.value; }

    if (take("(")) {
      const v = expression();
      if (!take(")")) throw new Error("닫는 괄호가 필요합니다.");
      return v;
    }

    if (t.type === "name") {
      pos++;
      const name = t.value;
      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;

      if (!["sqrt","sin","cos","tan","log","ln"].includes(name)) {
        throw new Error("지원하지 않는 함수: " + name);
      }

      let a;

      if (take("(")) {
        a = expression();
        if (!take(")")) throw new Error("함수 괄호가 닫히지 않았습니다.");
      } else {
        a = unary();
      }

      if (name === "sqrt") {
        if (a < 0) throw new Error("음수의 제곱근은 실수 범위에서 계산할 수 없습니다.");
        return Math.sqrt(a);
      }

      const angle = angleMode === "deg" ? a*Math.PI/180 : a;

      if (name === "sin") return Math.sin(angle);
      if (name === "cos") return Math.cos(angle);
      if (name === "tan") return Math.tan(angle);
      if (name === "log") {
        if (a <= 0) throw new Error("로그의 입력값은 0보다 커야 합니다.");
        return Math.log10(a);
      }
      if (a <= 0) throw new Error("자연로그의 입력값은 0보다 커야 합니다.");
      return Math.log(a);
    }

    throw new Error("수식의 순서를 확인해 주세요.");
  }

  const result = expression();

  if (pos !== tokens.length) throw new Error("수식을 확인해 주세요.");
  if (!Number.isFinite(result)) throw new Error("유효한 실수 결과가 아닙니다.");

  return result;
}

async function renderMath() {
  if (window.MathJax?.typesetClear) window.MathJax.typesetClear([answerText]);

  if (window.MathJax?.typesetPromise) {
    try { await window.MathJax.typesetPromise([answerText]); } catch {}
  }
}

function showResult(status, formula = "", answer = "") {
  statusText.textContent = status;
  formulaText.textContent = formula;
  answerText.textContent = answer;
}

async function performLocalCalculation(raw) {
  try {
    const original = raw.trim();
    if (!original) throw new Error("수식을 입력해 주세요.");

    if (original.includes("=")) {
      const solved = solveEquation(original);

      showResult("방정식 풀이 완료", "입력한 방정식: " + solved.normalized, solved.display);
      await renderMath();
      return;
    }

    const normalized = prepareExpression(original);
    const value = calculateExpression(tokenize(normalized));

    showResult(
      "계산 완료",
      "변환한 수식: " + normalized,
      "결과: " + fmtNumber(value)
    );
  } catch (error) {
    showResult("계산할 수 없습니다.", error.message, "");
  }
}

document.getElementById("localFromEditor").addEventListener("click", () => {
  performLocalCalculation(editor.value);
});

document.getElementById("calcForm").addEventListener("submit", event => {
  event.preventDefault();
  performLocalCalculation(input.value);
});

const layouts = {
  main: [
    ["(", "("], [")", ")"], ["x²", "^2"], ["xʸ", "^"], ["√", "sqrt("],
    ["7","7"],["8","8"],["9","9"],["÷","/"],["a/b","()/()",1],
    ["4","4"],["5","5"],["6","6"],["×","*"],["π","pi"],
    ["1","1"],["2","2"],["3","3"],["−","-"],["+","+"],
    ["0","0"],[".","."],["sin","sin("],["cos","cos("],["tan","tan("],
    ["x","x"],["=","="],["y","y"],["z","z"],["^3","^3"]
  ],
  letters: [
    ["x","x"],["y","y"],["z","z"],["a","a"],["b","b"],
    ["c","c"],["m","m"],["t","t"],["V","V"],["I","I"],
    ["R","R"],["P","P"],["L","L"],["C","C"],["F","F"],
    ["(","("],[")",")"],["=","="],["+","+"],["−","-"],
    ["×","*"],["÷","/"],["^","^"],["π","pi"],[".","."]
  ],
  functions: [
    ["sin(","sin("],["cos(","cos("],["tan(","tan("],["√","sqrt("],["log(","log("],
    ["ln(","ln("],["π","pi"],["e","e"],["x²","^2"],["xʸ","^"],
    ["(","("],[")",")"],["=","="],["+","+"],["−","-"],
    ["×","*"],["÷","/"],["a/b","()/()",1],["x","x"],["^3","^3"]
  ]
};

function insertAtCursor(text, offset) {
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? editor.value.length;

  editor.setRangeText(text, start, end, "end");
  const caret = start + (Number.isInteger(offset) ? offset : text.length);

  editor.focus();
  editor.setSelectionRange(caret, caret);
}

function renderKeys(tab) {
  keyGrid.replaceChildren();

  for (const [label, value, caret] of layouts[tab]) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "key";

    if (["+", "-", "*", "/", "^", "="].includes(value)) b.classList.add("operator");
    if (["sqrt(", "sin(", "cos(", "tan(", "pi", "log(", "ln("].includes(value)) b.classList.add("function");

    b.textContent = label;
    b.addEventListener("click", () => insertAtCursor(value, caret));
    keyGrid.appendChild(b);
  }

  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === tab);
  });
}

document.querySelectorAll(".tab").forEach(b => {
  b.addEventListener("click", () => renderKeys(b.dataset.tab));
});

document.getElementById("clearButton").addEventListener("click", () => {
  editor.value = "";
  editor.focus();
});

document.getElementById("backspaceButton").addEventListener("click", () => {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;

  if (start !== end) editor.setRangeText("", start, end, "end");
  else if (start > 0) editor.setRangeText("", start-1, end, "end");

  editor.focus();
});

document.getElementById("degButton").addEventListener("click", () => {
  angleMode = "deg";
  document.getElementById("degButton").classList.add("active");
  document.getElementById("radButton").classList.remove("active");
});

document.getElementById("radButton").addEventListener("click", () => {
  angleMode = "rad";
  document.getElementById("radButton").classList.add("active");
  document.getElementById("degButton").classList.remove("active");
});

document.querySelectorAll(".example-item").forEach(b => {
  b.addEventListener("click", () => {
    input.value = b.dataset.example;
    input.focus();
  });
});

const aiButton = document.getElementById("aiButton");

aiButton.addEventListener("click", async () => {
  const question = input.value.trim();
  if (!question) {
    showResult("질문을 입력해 주세요.");
    input.focus();
    return;
  }

  aiButton.disabled = true;
  aiButton.textContent = "AI가 풀이 중...";
  showResult("AI에 질문을 보내고 있습니다.");

  try {
    const response = await fetch(AI_API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question})
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "AI 요청에 실패했습니다.");
    if (!data.answer) throw new Error("AI가 답변을 반환하지 않았습니다.");

    showResult("AI 풀이 완료", "질문: " + question, data.answer);
    await renderMath();
  } catch (error) {
    showResult("AI 요청 실패", "", error.message);
  } finally {
    aiButton.disabled = false;
    aiButton.textContent = "AI로 공학 문제 풀이";
  }
});

renderKeys("main");
</script>
