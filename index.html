
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공학용 계산기</title>

<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"], ["$", "$"]],
    displayMath: [["\\[", "\\]"], ["$$", "$$"]]
  },
  chtml: { displayAlign: "left" }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: #f5f7fb;
  color: #172033;
  font-family: Arial, "Malgun Gothic", sans-serif;
}
.app {
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  align-items: stretch;
}
.panel {
  min-width: 0;
  min-height: 720px;
  padding: 20px;
  border: 1px solid #d6e2f4;
  border-radius: 18px;
  background: white;
}
h1 { font-size: 23px; margin: 0 0 18px; }
button { cursor: pointer; font: inherit; }
.screen {
  min-height: 125px;
  padding: 12px;
  border: 1px solid #d6e2f4;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}
#display {
  width: 100%;
  padding: 8px 0;
  border: 0;
  outline: 0;
  font-size: 24px;
  text-align: right;
  color: #172033;
}
#screenResult {
  text-align: right;
  color: #64748b;
  overflow-wrap: anywhere;
}
.mode-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
}
.mode {
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  background: #edf2fa;
  color: #475569;
}
.mode.active { background: #0866d9; color: white; }
#memoryStatus { font-size: 12px; color: #94a3b8; }
.keypad {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 7px;
}
.key {
  min-width: 0;
  min-height: 47px;
  padding: 6px 2px;
  border: 1px solid #d6e2f4;
  border-radius: 9px;
  background: #eff4fc;
  color: #172033;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.key.number { background: white; }
.key.function { background: #f0f5ff; }
.key.operator { background: #e8f0ff; }
.key.danger { background: #fff0f0; color: #dc2626; }
.key.equal {
  grid-column: span 3;
  background: #0866d9;
  color: white;
  font-size: 20px;
}
.history-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 15px;
  border-bottom: 1px solid #d6e2f4;
}
.history-heading h2 { font-size: 18px; margin: 0; }
.clear-history {
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: #edf2fa;
  color: #475569;
  font-size: 12px;
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
  max-height: 650px;
  overflow-y: auto;
  padding: 2px 5px 8px 0;
}
.history-item {
  padding: 14px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: white;
  cursor: pointer;
}
.history-item:hover { background: #f8fbff; }
.history-expression {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}
.history-answer {
  line-height: 1.9;
  font-size: 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 4px 0 8px;
  overflow: visible;
}
mjx-container { max-width: 100% !important; }
mjx-container[display="true"] {
  margin: .6em 0 !important;
  padding: .2em 0 .35em;
  overflow: visible !important;
}
.empty {
  padding: 30px 10px;
  color: #94a3b8;
  text-align: center;
  font-size: 14px;
}
@media(max-width: 900px) {
  body { padding: 10px; }
  .app { grid-template-columns: 1fr; }
  .panel { min-height: 0; padding: 16px; }
}
@media(max-width: 420px) {
  .keypad { gap: 5px; }
  .key { min-height: 42px; font-size: 12px; }
  #display { font-size: 20px; }
}
</style>
</head>
<body>

<div class="app">
  <section class="panel">
    <h1>공학용 계산기</h1>

    <div class="screen">
      <input id="display" autocomplete="off" placeholder="수식 입력">
      <div id="screenResult"></div>
    </div>

    <div class="mode-row">
      <div>
        <button class="mode active" id="degButton">Deg</button>
        <button class="mode" id="radButton">Rad</button>
      </div>
      <span id="memoryStatus">M: 비어 있음</span>
    </div>

    <div class="keypad" id="keypad"></div>
  </section>

  <section class="panel">
    <div class="history-heading">
      <h2>계산 기록</h2>
      <button class="clear-history" id="clearHistory">기록 지우기</button>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty">계산 기록이 여기에 표시됩니다.</div>
    </div>
  </section>
</div>

<script>
"use strict";

const display = document.getElementById("display");
const screenResult = document.getElementById("screenResult");
const historyList = document.getElementById("historyList");
const keypad = document.getElementById("keypad");
const memoryStatus = document.getElementById("memoryStatus");

let angleMode = "deg";
let memoryValue = null;
let lastAnswer = 0;
let history = [];

const functions = [
  "sqrt", "nthroot", "sin", "cos", "tan",
  "asin", "acos", "atan", "log", "ln",
  "abs", "floor", "ceil", "round", "factorial",
  "exp", "pi", "e"
];

function formatNumber(n) {
  if (!Number.isFinite(n)) {
    throw new Error("유효하지 않은 계산 결과입니다.");
  }
  if (Math.abs(n) < 1e-12) return "0";
  return Number(n.toPrecision(10)).toString();
}

// 한글 숫자 변환
function koreanNumberToArabic(word) {
  const digits = {
    "영":0, "공":0, "일":1, "이":2, "삼":3,
    "사":4, "오":5, "육":6, "칠":7, "팔":8, "구":9
  };
  const units = {"십":10, "백":100, "천":1000};

  // 이삼 -> 23, 일공오 -> 105
  if (![..."십백천"].some(ch => word.includes(ch))) {
    return [...word].map(ch => digits[ch]).join("");
  }

  let total = 0;
  let section = 0;
  let current = 0;

  for (const ch of word) {
    if (digits[ch] !== undefined) {
      current = digits[ch];
    } else if (units[ch]) {
      section += (current || 1) * units[ch];
      current = 0;

      if (units[ch] === 1000) {
        total += section;
        section = 0;
      }
    }
  }

  return String(total + section + current);
}

// 한글 표현을 수식으로 변환
function normalizeExpression(raw) {
  let s = raw.trim().toLowerCase();

  if (s.length > 300) {
    throw new Error("수식은 300자 이하로 입력해 주세요.");
  }

  // 한글 변수: 엑스 -> x
  s = s.replace(/엑스/g, "x");

  // 기호 변환
  s = s.replace(/×/g, "*")
       .replace(/÷/g, "/")
       .replace(/[−–]/g, "-")
       .replace(/²/g, "^2")
       .replace(/³/g, "^3");

  // 자연어 연산자
  s = s.replace(/더하기/g, "+")
       .replace(/곱하기/g, "*")
       .replace(/나누기/g, "/")
       .replace(/빼기/g, "-")
       .replace(/플러스/g, "+")
       .replace(/마이너스/g, "-");

  // 제곱 및 함수 표현을 숫자 변환 전에 처리
  s = s.replace(/의\s*세제곱/g, "^3")
       .replace(/의\s*제곱/g, "^2")
       .replace(/세제곱/g, "^3")
       .replace(/제곱근/g, "sqrt")
       .replace(/제곱/g, "^2")
       .replace(/루트/g, "sqrt")
       .replace(/자연로그/g, "ln")
       .replace(/코사인/g, "cos")
       .replace(/탄젠트/g, "tan")
       .replace(/사인/g, "sin")
       .replace(/로그/g, "log")
       .replace(/파이/g, "pi");

  // 은/는을 등호로 변환
  s = s.replace(/은/g, "=")
       .replace(/는/g, "=");

  // 공백 없는 한글 숫자도 연산자 기준으로 인식
  const numberWords = "영공일이삼사오육칠팔구십백천";
  const numberPattern = new RegExp(
    "[" + numberWords + "]+(?=$|[+*/^()=\\-\\s])",
    "g"
  );

  s = s.replace(numberPattern, word => koreanNumberToArabic(word));

  // 함수에 숫자를 바로 입력하는 경우
  s = s.replace(
    /\b(sqrt|sin|cos|tan|asin|acos|atan|log|ln|abs|floor|ceil|round)\s+([+-]?\d+(?:\.\d+)?)/g,
    "$1($2)"
  );

  // 암시적 곱셈: 2x, 2pi, 2(x+1)
  s = s.replace(/(\d)(x|pi|e|\()/g, "$1*$2")
       .replace(/(x|pi|\))(\d|x|pi|\()/g, "$1*$2");

  return s.trim();
}

// 1차·2차 방정식 풀이
function solveEquation(expr) {
  if ((expr.match(/=/g) || []).length !== 1) {
    throw new Error("등호 하나로 방정식을 입력해 주세요.");
  }

  const [left, right] = expr.split("=").map(s => s.trim());

  if (!left || !right) {
    throw new Error("등호 양쪽에 식을 입력해 주세요.");
  }

  const residual = `(${left})-(${right})`;

  const names = [...new Set(
    (left + " " + right).match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || []
  )].filter(name => !functions.includes(name));

  if (names.length !== 1) {
    throw new Error("미지수 하나인 방정식만 지원합니다.");
  }

  const variable = names[0];
  let coeffs = null;

  // 다항식 계수를 구합니다.
  try {
    const expanded = nerdamer(residual).expand().toString();
    const vector = nerdamer.coeffs(expanded, variable);
    coeffs = [];

    vector.each((item, index) => {
      coeffs[index] = Number(
        nerdamer(String(item)).evaluate().text("decimals")
      );
    });
  } catch (_) {}

  if (coeffs && coeffs.length <= 3) {
    while (
      coeffs.length > 1 &&
      Math.abs(coeffs[coeffs.length - 1]) < 1e-10
    ) {
      coeffs.pop();
    }

    // 상수식
    if (coeffs.length === 1) {
      return {
        answer: Math.abs(coeffs[0]) < 1e-10
          ? "항등식입니다."
          : "해가 없습니다."
      };
    }

    // 일차방정식
    if (coeffs.length === 2) {
      const root = -coeffs[0] / coeffs[1];

      return {
        answer: `\\[${variable} = ${formatNumber(root)}\\]`
      };
    }

    // 이차방정식
    if (coeffs.length === 3) {
      const [c, b, a] = coeffs;
      const D = b*b - 4*a*c;
      const denominator = 2*a;

      if (D < -1e-10) {
        const real = -b / denominator;
        const imaginary = Math.sqrt(-D) / Math.abs(denominator);

        if (Math.abs(real) < 1e-10) {
          return {
            answer:
              `복소수 해:\n` +
              `\\[${variable} = ${formatNumber(imaginary)}i\\]\n` +
              `\\[${variable} = -${formatNumber(imaginary)}i\\]`
          };
        }

        return {
          answer:
            `복소수 해:\n` +
            `\\[${variable} = ${formatNumber(real)}+${formatNumber(imaginary)}i\\]\n` +
            `\\[${variable} = ${formatNumber(real)}-${formatNumber(imaginary)}i\\]`
        };
      }

      if (Math.abs(D) < 1e-10) {
        return {
          answer: `\\[${variable} = ${formatNumber(-b/denominator)}\\]`
        };
      }

      const roots = [
        (-b + Math.sqrt(D)) / denominator,
        (-b - Math.sqrt(D)) / denominator
      ];

      // 정수 계수 이차방정식은 가능한 경우 근호 형태도 표시
      if ([a,b,c,D].every(n => Math.abs(n - Math.round(n)) < 1e-8)) {
        const ai = Math.round(a);
        const bi = Math.round(b);
        const di = Math.round(D);
        const sd = Math.round(Math.sqrt(di));

        if (sd * sd !== di) {
          let inside = di;
          let outside = 1;

          for (let i = 2; i * i <= inside; i++) {
            while (inside % (i * i) === 0) {
              inside /= i * i;
              outside *= i;
            }
          }

          let base = -bi;
          let factor = outside;
          let den = 2 * ai;

          if (den < 0) {
            base = -base;
            den = -den;
          }

          const radical =
            (factor === 1 ? "" : factor) + `\\sqrt{${inside}}`;

          const numerator = base === 0
            ? `\\pm ${radical}`
            : `${base < 0 ? "-" : ""}${Math.abs(base)} \\pm ${radical}`;

          const exact = den === 1
            ? numerator
            : `\\frac{${numerator}}{${den}}`;

          return {
            answer:
              `정확한 해:\n\\[${variable} = ${exact}\\]\n\n` +
              `소수 근삿값:\n` +
              roots.map(x =>
                `\\[${variable} \\approx ${formatNumber(x)}\\]`
              ).join("\n")
          };
        }
      }

      return {
        answer: roots.map(x =>
          `\\[${variable} = ${formatNumber(x)}\\]`
        ).join("\n")
      };
    }
  }

  // Nerdamer API가 제공되는 경우 고차방정식도 시도
  if (typeof nerdamer.solveEquations === "function") {
    try {
      const solved = nerdamer.solveEquations(residual, variable);

      if (solved && String(solved) !== "[]") {
        return {answer: "해:\n" + String(solved)};
      }
    } catch (_) {}
  }

  throw new Error("이 방정식은 풀 수 없습니다. 일차 또는 이차방정식인지 확인해 주세요.");
}

function prepareTrig(expr) {
  if (angleMode === "rad") return expr;

  return expr.replace(/\b(sin|cos|tan)\(([^()]*)\)/g, (whole, fn, arg) => {
    if (/^[0-9.+\-*/\s]+$/.test(arg)) {
      return `${fn}((${arg})*pi/180)`;
    }
    return whole;
  });
}

function calculate(raw) {
  const expr = normalizeExpression(raw);

  if (!expr) {
    throw new Error("수식을 입력해 주세요.");
  }

  if (expr.includes("=")) {
    return {expr, ...solveEquation(expr)};
  }

  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(expr)) {
    throw new Error("지원하지 않는 문자가 있습니다.");
  }

  const identifiers = expr.match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [];
  const unknown = identifiers.filter(n => !functions.includes(n));

  if (unknown.length) {
    throw new Error("숫자 계산에 변수가 포함되어 있습니다.");
  }

  const value = Number(
    nerdamer(prepareTrig(expr)).evaluate().text("decimals")
  );

  if (!Number.isFinite(value)) {
    throw new Error("계산할 수 없는 수식입니다.");
  }

  return {
    expr,
    value,
    answer: `\\[${expr.replace(/\*/g, " \\times ")} = ${formatNumber(value)}\\]`
  };
}

async function typeset(element) {
  if (!window.MathJax?.typesetPromise) return;

  try {
    MathJax.typesetClear?.([element]);
    await MathJax.typesetPromise([element]);
  } catch (_) {}
}

function addHistory(expr, answer) {
  history.unshift({expr, answer});
  history = history.slice(0, 10);
  historyList.replaceChildren();

  for (const item of history) {
    const card = document.createElement("div");
    card.className = "history-item";

    const expression = document.createElement("div");
    expression.className = "history-expression";
    expression.textContent = item.expr;

    const result = document.createElement("div");
    result.className = "history-answer";
    result.textContent = item.answer;

    card.append(expression, result);

    card.addEventListener("click", () => {
      display.value = item.expr;
      display.focus();
    });

    historyList.appendChild(card);
    typeset(result);
  }

  if (!history.length) {
    historyList.innerHTML =
      '<div class="empty">계산 기록이 없습니다.</div>';
  }
}

function calculateCurrent() {
  const raw = display.value.trim();

  try {
    const result = calculate(raw);

    if (result.value !== undefined) {
      lastAnswer = result.value;
      screenResult.textContent = formatNumber(result.value);
    } else {
      screenResult.textContent = "계산 완료";
    }

    addHistory(result.expr, result.answer);
  } catch (error) {
    screenResult.textContent = error.message || "계산 오류";
    addHistory(raw, error.message || "계산 오류");
  }
}

function insertText(text) {
  const start = display.selectionStart ?? display.value.length;
  const end = display.selectionEnd ?? display.value.length;

  display.setRangeText(text, start, end, "end");
  display.focus();
}

function changeMemory(direction) {
  try {
    const result = calculate(display.value);

    if (result.value === undefined) {
      throw new Error("숫자 계산에만 사용할 수 있습니다.");
    }

    memoryValue = (memoryValue || 0) + direction * result.value;
    memoryStatus.textContent = "M: " + formatNumber(memoryValue);
  } catch (error) {
    screenResult.textContent = error.message;
  }
}

const keys = [
  ["sin","sin(","function"], ["cos","cos(","function"],
  ["tan","tan(","function"], ["asin","asin(","function"],
  ["acos","acos(","function"], ["atan","atan(","function"],
  ["log","log(","function"], ["ln","ln(","function"],
  ["x²","^2","function"], ["x³","^3","function"],
  ["xʸ","^","function"], ["√x","sqrt(","function"],
  ["³√x","nthroot(","function"], ["10ˣ","10^(","function"],
  ["eˣ","e^(","function"], ["1/x","1/(","function"],
  ["abs","abs(","function"], ["π","pi","function"],
  ["M+","M+","utility"], ["M−","M-","utility"],
  ["MR","MR","utility"], ["e","e","function"],
  ["(","(","utility"], [")",")","utility"],
  ["7","7","number"], ["8","8","number"],
  ["9","9","number"], ["/","/","operator"],
  ["%","/100","operator"], ["^","^","operator"],
  ["4","4","number"], ["5","5","number"],
  ["6","6","number"], ["*","*","operator"],
  ["±","±","operator"], ["AC","AC","danger"],
  ["1","1","number"], ["2","2","number"],
  ["3","3","number"], ["-","-","operator"],
  ["Ans","Ans","operator"], ["C","C","danger"],
  ["0","0","number"], [".",".","number"],
  ["+","+","operator"], ["=","=","equal"]
];

for (const [label, value, cls] of keys) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "key " + cls;
  button.textContent = label;

  button.addEventListener("click", () => {
    if (value === "=") return calculateCurrent();

    if (value === "AC") {
      display.value = "";
      screenResult.textContent = "";
      display.focus();
      return;
    }

    if (value === "C") {
      const start = display.selectionStart;
      const end = display.selectionEnd;

      if (start !== end) {
        display.setRangeText("", start, end, "end");
      } else if (start > 0) {
        display.setRangeText("", start - 1, end, "end");
      }

      display.focus();
      return;
    }

    if (value === "±") {
      display.value = display.value.startsWith("-(")
        ? display.value.slice(2, -1)
        : `-(${display.value})`;

      display.focus();
      return;
    }

    if (value === "Ans") return insertText(String(lastAnswer));
    if (value === "M+") return changeMemory(1);
    if (value === "M-") return changeMemory(-1);

    if (value === "MR") {
      if (memoryValue !== null) insertText(String(memoryValue));
      return;
    }

    insertText(value);
  });

  keypad.appendChild(button);
}

document.getElementById("degButton").onclick = () => {
  angleMode = "deg";
  document.getElementById("degButton").classList.add("active");
  document.getElementById("radButton").classList.remove("active");
};

document.getElementById("radButton").onclick = () => {
  angleMode = "rad";
  document.getElementById("radButton").classList.add("active");
  document.getElementById("degButton").classList.remove("active");
};

document.getElementById("clearHistory").onclick = () => {
  history = [];
  historyList.innerHTML =
    '<div class="empty">계산 기록이 없습니다.</div>';
};

display.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    calculateCurrent();
  }
});
</script>
</body>
</html>
