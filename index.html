<style>
* { box-sizing: border-box; }

:root {

  --purple: #6d28d9;
  --bg: #f2f5fb;
  --muted: #64748b;

}

body {

.layout {

.panel {

.subtext, .examples {

}

}

}

<body>

<script>
const AI_API_URL =
  "https://calculator.sojaehyeock0109-jpg.workers.dev/api/solve";

const editor = document.getElementById("formulaEditor");
const calcForm = document.getElementById("calcForm");
const input = document.getElementById("expression");
const statusText = document.getElementById("status");
const formulaText = document.getElementById("formula");
const answerText = document.getElementById("answer");
const aiButton = document.getElementById("aiButton");
const keyGrid = document.getElementById("keyGrid");

let angleMode = "deg";

function prepareExpression(raw) {
  if (raw.length > 300) throw new Error("입력은 300자 이하여야 합니다.");

  let s = raw.toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-");

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );
  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const replacements = [
    ["자연로그", "ln"], ["제곱근", "sqrt"],
    ["코사인", "cos"], ["탄젠트", "tan"],
    ["사인", "sin"], ["세제곱", "^3"],
    ["제곱", "^2"], ["루트", "sqrt"],
    ["로그", "log"], ["파이", "pi"],
    ["더하기", "+"], ["플러스", "+"],
    ["빼기", "-"], ["마이너스", "-"],
    ["곱하기", "*"], ["나누기", "/"],
    ["의", ""], ["도", ""]
  ];

  for (const [word, replacement] of replacements) {
    s = s.split(word).join(replacement);
  }

  return s.trim();
}

// 방정식을 Nerdamer로 풉니다. AI API는 사용하지 않습니다.
function solveEquation(raw) {
  const normalized = prepareExpression(raw);

  if (!normalized.includes("=")) return null;

  if ((normalized.match(/=/g) || []).length !== 1) {
    throw new Error("현재는 등호가 하나인 방정식만 지원합니다.");
  }

  const [left, right] = normalized.split("=").map(s => s.trim());

  if (!left || !right) {
    throw new Error("등호의 양쪽에 수식을 입력해 주세요.");
  }

  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(left + right)) {
    throw new Error("방정식에 지원하지 않는 문자가 있습니다.");
  }

  if (!window.nerdamer || typeof window.nerdamer.solve !== "function") {
    throw new Error("방정식 풀이 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  }

  const ignored = new Set([
    "sqrt", "sin", "cos", "tan", "log", "ln", "pi", "e"
  ]);

  const variables = [...new Set(
    (normalized.match(/[a-zA-Z]+/g) || [])
      .map(s => s.toLowerCase())
      .filter(s => !ignored.has(s))
  )];

  if (variables.length === 0) {
    throw new Error("방정식에서 미지수를 찾지 못했습니다. 예: x^2 + 4 = 16");
  }

  if (variables.length > 1) {
    throw new Error("현재는 미지수 하나를 구하는 방정식만 지원합니다.");
  }

  const variable = variables[0];
  const residual = `(${left})-(${right})`;

  let solution;

  try {
    solution = window.nerdamer.solve(residual, variable);
  } catch {
    throw new Error("이 방정식은 현재 풀이 엔진에서 지원하지 않거나 해를 구하지 못했습니다.");
  }

  let rawSolutions = String(solution).trim()
    .replace(/^\{|\}$/g, "")
    .replace(/^\[|\]$/g, "")
    .trim();

  if (
    !rawSolutions ||
    rawSolutions === "[]" ||
    rawSolutions === "{}" ||
    /unsolved|undefined|NaN/i.test(rawSolutions)
  ) {
    throw new Error("해를 구하지 못했습니다. 방정식 형식을 확인해 주세요.");
  }

  const roots = rawSolutions
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  const latexRoots = roots.map(root => {
    try {
      const tex = window.nerdamer(root).toTeX();
      return `\\(${variable} = ${tex}\\)`;
    } catch {
      return `\\(${variable} = ${root}\\)`;
    }
  });

  return {
    normalized,
    variable,
    roots,
    display: latexRoots.join(" , ")
  };
}

function tokenize(s) {
  const tokens = [];
  let i = 0;

  while (i < s.length) {
    if (/\s/.test(s[i])) { i++; continue; }

    const rest = s.slice(i);
    const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);

    if (number) {
      tokens.push({type: "number", value: Number(number[0])});
      i += number[0].length;
      continue;
    }

    const name = rest.match(/^[a-z]+/);

    if (name) {
      tokens.push({type: "name", value: name[0]});
      i += name[0].length;
      continue;
    }

    if ("+-*/^()".includes(s[i])) {
      tokens.push({type: "symbol", value: s[i++]});
      continue;
    }

    throw new Error("인식할 수 없는 문자: " + s[i]);
  }

  if (!tokens.length) throw new Error("수식을 입력해 주세요.");
  return tokens;
}

function calculateExpression(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];

  function take(value) {
    if (peek() && peek().value === value) {
      pos++;
      return true;
    }
    return false;
  }

  function expression() {
    let v = term();

    while (peek() && ["+", "-"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const r = term();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }

  function term() {
    let v = unary();

    while (peek() && ["*", "/"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const r = unary();
      if (op === "/" && r === 0) throw new Error("0으로 나눌 수 없습니다.");
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }

  function unary() {
    if (take("+")) return unary();
    if (take("-")) return -unary();
    return power();
  }

  function power() {
    const base = primary();
    if (take("^")) return Math.pow(base, unary());
    return base;
  }

  function primary() {
    const t = peek();
    if (!t) throw new Error("수식이 완성되지 않았습니다.");

    if (t.type === "number") {
      pos++;
      return t.value;
    }

    if (take("(")) {
      const v = expression();
      if (!take(")")) throw new Error("닫는 괄호가 필요합니다.");
      return v;
    }

    if (t.type === "name") {
      pos++;
      const name = t.value;

      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;

      if (!["sqrt", "sin", "cos", "tan", "log", "ln"].includes(name)) {
        throw new Error("지원하지 않는 함수: " + name);
      }

      let a;

      if (take("(")) {
        a = expression();
        if (!take(")")) throw new Error("함수 괄호가 닫히지 않았습니다.");
      } else {
        a = unary();
      }

      if (name === "sqrt") {
        if (a < 0) throw new Error("음수의 제곱근은 실수 범위에서 계산할 수 없습니다.");
        return Math.sqrt(a);
      }

      const angle = angleMode === "deg" ? a * Math.PI / 180 : a;

      if (name === "sin") return Math.sin(angle);
      if (name === "cos") return Math.cos(angle);
      if (name === "tan") return Math.tan(angle);
      if (name === "log") {
        if (a <= 0) throw new Error("로그의 입력값은 0보다 커야 합니다.");
        return Math.log10(a);
      }

      if (a <= 0) throw new Error("자연로그의 입력값은 0보다 커야 합니다.");
      return Math.log(a);
    }

    throw new Error("수식의 순서를 확인해 주세요.");
  }

  const result = expression();

  if (pos !== tokens.length) {
    throw new Error("연산자나 괄호의 위치를 확인해 주세요.");
  }

  if (!Number.isFinite(result)) {
    throw new Error("유효한 실수 결과가 아닙니다.");
  }

  return result;
}

function setResultStatus(status, formula = "", answer = "") {
  statusText.textContent = status;
  formulaText.textContent = formula;
  answerText.textContent = answer;
}

async function renderMath() {
  if (window.MathJax?.typesetClear) {
    window.MathJax.typesetClear([answerText]);
  }

  if (window.MathJax?.typesetPromise) {
    try {
      await window.MathJax.typesetPromise([answerText]);
    } catch {}
  }
}

// 좌우 계산기 모두 방정식 풀이를 지원합니다.
function calculateInput(raw) {
  const original = raw.trim();

  if (!original) throw new Error("수식을 입력해 주세요.");

  if (original.includes("=") || /(?:제곱|더하기|빼기|루트|분의|곱하기|나누기)/.test(original)) {
    const eq = solveEquation(original);

    if (eq) {
      return {
        equation: true,
        normalized: eq.normalized,
        answer: eq.display
      };
    }
  }

  if (original.includes("=")) {
    const eq = solveEquation(original);
    if (eq) return {equation: true, normalized: eq.normalized, answer: eq.display};
  }

  const normalized = prepareExpression(original);
  const value = calculateExpression(tokenize(normalized));

  return {
    equation: false,
    normalized,
    answer: "결과: " + Number(value.toPrecision(12)).toString()
  };
}

async function performLocalCalculation(raw) {
  try {
    const result = calculateInput(raw);

    if (result.equation) {
      setResultStatus("방정식 풀이 완료", "입력한 방정식: " + result.normalized, result.answer);
      await renderMath();
    } else {
      setResultStatus("계산 완료", "변환한 수식: " + result.normalized, result.answer);
    }
  } catch (error) {
    setResultStatus("계산할 수 없습니다.", error.message, "");
  }
}

// 키패드
const keyLayouts = {
  main: [
    ["(", "("], [")", ")"], ["x²", "^2"], ["xʸ", "^"], ["√", "sqrt("],
    ["7", "7"], ["8", "8"], ["9", "9"], ["÷", "/"], ["a/b", "()/()", 1],
    ["4", "4"], ["5", "5"], ["6", "6"], ["×", "*"], ["π", "pi"],
    ["1", "1"], ["2", "2"], ["3", "3"], ["−", "-"], ["+", "+"],
    ["0", "0"], [".", "."], ["sin", "sin("], ["cos", "cos("], ["tan", "tan("],
    ["x", "x"], ["=", "="], ["y", "y"], ["z", "z"], ["^3", "^3"]
  ],
  letters: [
    ["x", "x"], ["y", "y"], ["z", "z"], ["a", "a"], ["b", "b"],
    ["c", "c"], ["m", "m"], ["t", "t"], ["V", "V"], ["I", "I"],
    ["R", "R"], ["P", "P"], ["L", "L"], ["C", "C"], ["F", "F"],
    ["(", "("], [")", ")"], ["=", "="], ["+", "+"], ["−", "-"],
    ["×", "*"], ["÷", "/"], ["^", "^"], ["π", "pi"], [".", "."]
  ],
  functions: [
    ["sin(", "sin("], ["cos(", "cos("], ["tan(", "tan("], ["√", "sqrt("], ["log(", "log("],
    ["ln(", "ln("], ["π", "pi"], ["e", "e"], ["x²", "^2"], ["xʸ", "^"],
    ["(", "("], [")", ")"], ["=", "="], ["+", "+"], ["−", "-"],
    ["×", "*"], ["÷", "/"], ["a/b", "()/()", 1], ["x", "x"], ["^3", "^3"]
  ]
};

function insertAtCursor(text, offset) {
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? editor.value.length;

  editor.setRangeText(text, start, end, "end");

  const caret = start + (Number.isInteger(offset) ? offset : text.length);
  editor.focus();
  editor.setSelectionRange(caret, caret);
}

function renderKeys(tab) {
  keyGrid.replaceChildren();

  for (const [label, value, caret] of keyLayouts[tab]) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "key";
    button.textContent = label;

    if (["+", "-", "*", "/", "^", "="].includes(value)) button.classList.add("operator");
    if (["sqrt(", "sin(", "cos(", "tan(", "pi", "log(", "ln("].includes(value)) button.classList.add("function");

    button.addEventListener("click", () => insertAtCursor(value, caret));
    keyGrid.appendChild(button);
  }

  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === tab);
  });
}

document.querySelectorAll(".tab").forEach(b => {
  b.addEventListener("click", () => renderKeys(b.dataset.tab));
});

document.getElementById("clearButton").addEventListener("click", () => {
  editor.value = "";
  editor.focus();
});

document.getElementById("backspaceButton").addEventListener("click", () => {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;

  if (start !== end) editor.setRangeText("", start, end, "end");
  else if (start > 0) editor.setRangeText("", start - 1, end, "end");

  editor.focus();
});

document.getElementById("degButton").addEventListener("click", () => {
  angleMode = "deg";
  document.getElementById("degButton").classList.add("active");
  document.getElementById("radButton").classList.remove("active");
});

document.getElementById("radButton").addEventListener("click", () => {
  angleMode = "rad";
  document.getElementById("radButton").classList.add("active");
  document.getElementById("degButton").classList.remove("active");
});

document.querySelectorAll(".example-item").forEach(b => {
  b.addEventListener("click", () => {
    input.value = b.dataset.example;
    input.focus();
  });
});

calcForm.addEventListener("submit", async e => {
  e.preventDefault();
  await performLocalCalculation(input.value);
});

document.getElementById("localFromEditor").addEventListener("click", async () => {
  await performLocalCalculation(editor.value);
});

// 오른쪽 AI 기능은 그대로 유지합니다.
aiButton.addEventListener("click", async () => {
  const question = input.value.trim();

  if (!question) {
    setResultStatus("질문을 입력해 주세요.");
    input.focus();
    return;
  }

  aiButton.disabled = true;
  aiButton.textContent = "AI가 풀이 중...";
  setResultStatus("AI에 질문을 보내고 있습니다.");

  try {
    const response = await fetch(AI_API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question})
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) throw new Error(data.error || "AI 요청에 실패했습니다.");
    if (!data.answer) throw new Error("AI가 답변을 반환하지 않았습니다.");

    if (window.MathJax?.typesetClear) window.MathJax.typesetClear([answerText]);

    statusText.textContent = "AI 풀이 완료";
    formulaText.textContent = "질문: " + question;
    answerText.textContent = data.answer;

    await renderMath();
  } catch (error) {
    setResultStatus(
      "AI 요청 실패",
      "",
      error.name === "TypeError"
        ? "서버 연결을 확인해 주세요."
        : error.message
    );
  } finally {
    aiButton.disabled = false;
    aiButton.textContent = "AI로 공학 문제 풀이";
  }
});

renderKeys("main");
</script>
</body>
</html>
