<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공학 계산기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 32px auto;
      padding: 16px;
      background: #f3f6fb;
      color: #1f2937;
    }

    .app {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 6px 24px #0000000c;
    }

    h1 { margin-top: 0; }

    input, button {
      font: inherit;
      padding: 13px;
      border-radius: 9px;
    }

    input {
      width: 100%;
      margin: 12px 0;
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .examples {
      color: #64748b;
      font-size: 14px;
      line-height: 1.9;
      margin-top: 18px;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #eff6ff;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    #answer {
      font-size: 25px;
      font-weight: bold;
    }

    #formula {
      color: #475569;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      .app { padding: 20px; }
      body { margin: 12px auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>공학 계산기</h1>
    <p>수식을 평소 말하듯 입력해 보세요.</p>

    <form id="calcForm">
      <input
        id="expression"
        placeholder="예: 2의3제곱 더하기 5"
        autocomplete="off"
      >
      <button type="submit">계산하기</button>
    </form>

    <div class="examples">
      <strong>입력 예시</strong><br>
      루트 16<br>
      3의 제곱 더하기 2<br>
      2의3제곱<br>
      2의 세제곱<br>
      2분의 3 곱하기 10<br>
      사인 30도 더하기 코사인 60도<br>
      (2 + 3) 곱하기 4
    </div>

    <section class="result" aria-live="polite">
      <strong id="status">계산 결과가 여기에 표시됩니다.</strong>
      <p id="formula"></p>
      <p id="answer"></p>
    </section>
  </main>

<script>
const form = document.getElementById("calcForm");
const input = document.getElementById("expression");
const statusText = document.getElementById("status");
const formulaText = document.getElementById("formula");
const answerText = document.getElementById("answer");

// 한국어 수학 표현을 계산 가능한 수식으로 바꿉니다.
function prepareExpression(raw) {
  if (raw.length > 300) {
    throw new Error("수식은 300자 이하로 입력해 주세요.");
  }

  let s = raw.toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-");

  // 중요: 거듭제곱 표현을 '의' 삭제보다 먼저 변환합니다.
  // 2의3제곱 -> (2^3)
  // 2의 4제곱 -> (2^4)
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );

  // 2의세제곱 -> (2^3)
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );

  // 2분의3 -> (3/2)
  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const replacements = [
    ["자연로그", "ln"],
    ["제곱근", "sqrt"],
    ["코사인", "cos"],
    ["탄젠트", "tan"],
    ["사인", "sin"],
    ["세제곱", "^3"],
    ["제곱", "^2"],
    ["루트", "sqrt"],
    ["로그", "log"],
    ["파이", "pi"],
    ["더하기", "+"],
    ["플러스", "+"],
    ["빼기", "-"],
    ["마이너스", "-"],
    ["곱하기", "*"],
    ["나누기", "/"],
    ["의", ""],
    ["도", ""]
  ];

  for (const [word, replacement] of replacements) {
    s = s.split(word).join(replacement);
  }

  return s.trim();
}

// 숫자, 연산자, 함수 이름을 각각 분리합니다.
function tokenize(s) {
  const tokens = [];
  let i = 0;

  while (i < s.length) {
    if (/\s/.test(s[i])) {
      i++;
      continue;
    }

    const rest = s.slice(i);
    const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);

    if (number) {
      tokens.push({
        type: "number",
        value: Number(number[0])
      });

      i += number[0].length;
      continue;
    }

    const name = rest.match(/^[a-z]+/);

    if (name) {
      tokens.push({
        type: "name",
        value: name[0]
      });

      i += name[0].length;
      continue;
    }

    if ("+-*/^()".includes(s[i])) {
      tokens.push({
        type: "symbol",
        value: s[i]
      });

      i++;
      continue;
    }

    throw new Error("인식할 수 없는 문자: " + s[i]);
  }

  if (tokens.length === 0) {
    throw new Error("수식을 입력해 주세요.");
  }

  if (tokens.length > 150) {
    throw new Error("수식이 너무 복잡합니다.");
  }

  return tokens;
}

// 수식의 연산 순서를 지켜 계산합니다.
function calculateExpression(tokens) {
  let pos = 0;

  function peek() {
    return tokens[pos];
  }

  function take(value) {
    if (peek() && peek().value === value) {
      pos++;
      return true;
    }

    return false;
  }

  function expression() {
    let value = term();

    while (
      peek() &&
      (peek().value === "+" || peek().value === "-")
    ) {
      const op = tokens[pos++].value;
      const right = term();

      value = op === "+"
        ? value + right
        : value - right;
    }

    return value;
  }

  function term() {
    let value = unary();

    while (
      peek() &&
      (peek().value === "*" || peek().value === "/")
    ) {
      const op = tokens[pos++].value;
      const right = unary();

      if (op === "/" && right === 0) {
        throw new Error("0으로 나눌 수 없습니다.");
      }

      value = op === "*"
        ? value * right
        : value / right;
    }

    return value;
  }

  function unary() {
    if (take("+")) return unary();
    if (take("-")) return -unary();

    return power();
  }

  function power() {
    const base = primary();

    if (take("^")) {
      const exponent = unary();
      return Math.pow(base, exponent);
    }

    return base;
  }

  function primary() {
    const t = peek();

    if (!t) {
      throw new Error("수식이 완성되지 않았습니다.");
    }

    if (t.type === "number") {
      pos++;
      return t.value;
    }

    if (take("(")) {
      const value = expression();

      if (!take(")")) {
        throw new Error("닫는 괄호 )가 필요합니다.");
      }

      return value;
    }

    if (t.type === "name") {
      pos++;
      const name = t.value;

      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;

      const allowed = [
        "sqrt", "sin", "cos", "tan", "log", "ln"
      ];

      if (!allowed.includes(name)) {
        throw new Error("지원하지 않는 함수: " + name);
      }

      let a;

      // sqrt(16) 같은 괄호 형식 지원
      if (take("(")) {
        a = expression();

        if (!take(")")) {
          throw new Error("함수 괄호가 닫히지 않았습니다.");
        }
      } else {
        // sqrt 16 같은 자연어 형식 지원
        a = unary();
      }

      let result;

      if (name === "sqrt") {
        if (a < 0) {
          throw new Error("음수의 제곱근은 실수 범위에서 계산할 수 없습니다.");
        }

        result = Math.sqrt(a);
      } else if (name === "sin") {
        result = Math.sin(a * Math.PI / 180);
      } else if (name === "cos") {
        result = Math.cos(a * Math.PI / 180);
      } else if (name === "tan") {
        result = Math.tan(a * Math.PI / 180);
      } else if (name === "log") {
        if (a <= 0) {
          throw new Error("로그의 입력값은 0보다 커야 합니다.");
        }

        result = Math.log10(a);
      } else {
        if (a <= 0) {
          throw new Error("자연로그의 입력값은 0보다 커야 합니다.");
        }

        result = Math.log(a);
      }

      return result;
    }

    throw new Error("수식의 순서를 확인해 주세요.");
  }

  const result = expression();

  if (pos !== tokens.length) {
    throw new Error("연산자나 괄호의 위치를 확인해 주세요.");
  }

  if (!Number.isFinite(result)) {
    throw new Error("유효한 실수 결과가 아닙니다.");
  }

  return result;
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  try {
    const original = input.value.trim();

    if (!original) {
      throw new Error("수식을 입력해 주세요.");
    }

    const normalized = prepareExpression(original);
    const tokens = tokenize(normalized);
    const value = calculateExpression(tokens);

    statusText.textContent = "계산 완료";
    formulaText.textContent = "변환한 수식: " + normalized;
    answerText.textContent =
      "결과: " + Number(value.toPrecision(12)).toString();

  } catch (error) {
    statusText.textContent = "계산할 수 없습니다.";
    formulaText.textContent = error.message;
    answerText.textContent = "";
  }
});
</script>
</body>
</html>
