<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공학 계산기 AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 32px auto;
      padding: 16px;
      background: #f3f6fb;
      color: #1f2937;
    }

    .app {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 6px 24px #0000000c;
    }

    h1 { margin-top: 0; }

    input, button {
      font: inherit;
      padding: 13px;
      border-radius: 9px;
    }

    input {
      width: 100%;
      margin: 12px 0;
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin: 3px 3px 3px 0;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: wait; }

    .ai-button { background: #6d28d9; }
    .ai-button:hover { background: #5b21b6; }

    .examples {
      color: #64748b;
      font-size: 14px;
      line-height: 1.9;
      margin-top: 18px;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #eff6ff;
      border-radius: 12px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #answer {
      font-size: 20px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #formula { color: #475569; overflow-wrap: anywhere; }

    @media (max-width: 500px) {
      .app { padding: 20px; }
      body { margin: 12px auto; }
      button { width: 100%; margin: 4px 0; }
    }
  </style>
</head>

<body>
<main class="app">
  <h1>공학 계산기 AI</h1>
  <p>수식을 계산하거나 AI에게 공학 문제를 질문해 보세요.</p>

  <form id="calcForm">
    <input
      id="expression"
      placeholder="예: 2의3제곱 또는 전압 12V, 저항 4옴일 때 전류"
      autocomplete="off"
    >

    <button type="submit">수식 계산하기</button>
    <button type="button" class="ai-button" id="aiButton">
      AI로 공학 문제 풀이
    </button>
  </form>

  <div class="examples">
    <strong>수식 계산 예시</strong><br>
    루트 16<br>
    3의 제곱 더하기 2<br>
    2의3제곱<br>
    2분의 3 곱하기 10<br>
    사인 30도 더하기 코사인 60도<br><br>

    <strong>AI 질문 예시</strong><br>
    전압 12V, 저항 4옴일 때 전류를 구해 줘.<br>
    저항 10옴과 20옴이 병렬일 때 합성저항을 구해 줘.<br>
    RLC 회로의 공진 주파수 공식을 설명해 줘.
  </div>

  <section class="result" aria-live="polite">
    <strong id="status">계산 결과 또는 AI 풀이가 여기에 표시됩니다.</strong>
    <p id="formula"></p>
    <div id="answer"></div>
  </section>
</main>

<script>
// Cloudflare Worker의 AI API 주소
const AI_API_URL =
  "https://calculator.sojaehyeock0109.workers.dev/api/solve";

const form = document.getElementById("calcForm");
const input = document.getElementById("expression");
const statusText = document.getElementById("status");
const formulaText = document.getElementById("formula");
const answerText = document.getElementById("answer");
const aiButton = document.getElementById("aiButton");

// 한국어 수학 표현을 수식으로 변환
function prepareExpression(raw) {
  if (raw.length > 300) {
    throw new Error("수식은 300자 이하로 입력해 주세요.");
  }

  let s = raw.toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-");

  // "2의3제곱" -> (2^3)
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );

  // "2의세제곱" -> (2^3)
  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );

  // "2분의3" -> (3/2)
  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const replacements = [
    ["자연로그", "ln"],
    ["제곱근", "sqrt"],
    ["코사인", "cos"],
    ["탄젠트", "tan"],
    ["사인", "sin"],
    ["세제곱", "^3"],
    ["제곱", "^2"],
    ["루트", "sqrt"],
    ["로그", "log"],
    ["파이", "pi"],
    ["더하기", "+"],
    ["플러스", "+"],
    ["빼기", "-"],
    ["마이너스", "-"],
    ["곱하기", "*"],
    ["나누기", "/"],
    ["의", ""],
    ["도", ""]
  ];

  for (const [word, replacement] of replacements) {
    s = s.split(word).join(replacement);
  }

  return s.trim();
}

// 수식 토큰 분리
function tokenize(s) {
  const tokens = [];
  let i = 0;

  while (i < s.length) {
    if (/\s/.test(s[i])) {
      i++;
      continue;
    }

    const rest = s.slice(i);
    const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);

    if (number) {
      tokens.push({ type: "number", value: Number(number[0]) });
      i += number[0].length;
      continue;
    }

    const name = rest.match(/^[a-z]+/);

    if (name) {
      tokens.push({ type: "name", value: name[0] });
      i += name[0].length;
      continue;
    }

    if ("+-*/^()".includes(s[i])) {
      tokens.push({ type: "symbol", value: s[i] });
      i++;
      continue;
    }

    throw new Error("인식할 수 없는 문자: " + s[i]);
  }

  if (!tokens.length) throw new Error("수식을 입력해 주세요.");
  if (tokens.length > 150) throw new Error("수식이 너무 복잡합니다.");

  return tokens;
}

// 수식 계산: 입력을 JavaScript 코드로 직접 실행하지 않습니다.
function calculateExpression(tokens) {
  let pos = 0;

  function peek() {
    return tokens[pos];
  }

  function take(value) {
    if (peek() && peek().value === value) {
      pos++;
      return true;
    }
    return false;
  }

  function expression() {
    let value = term();

    while (peek() && ["+", "-"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const right = term();
      value = op === "+" ? value + right : value - right;
    }

    return value;
  }

  function term() {
    let value = unary();

    while (peek() && ["*", "/"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const right = unary();

      if (op === "/" && right === 0) {
        throw new Error("0으로 나눌 수 없습니다.");
      }

      value = op === "*" ? value * right : value / right;
    }

    return value;
  }

  function unary() {
    if (take("+")) return unary();
    if (take("-")) return -unary();
    return power();
  }

  function power() {
    const base = primary();

    if (take("^")) {
      return Math.pow(base, unary());
    }

    return base;
  }

  function primary() {
    const t = peek();

    if (!t) throw new Error("수식이 완성되지 않았습니다.");

    if (t.type === "number") {
      pos++;
      return t.value;
    }

    if (take("(")) {
      const value = expression();
      if (!take(")")) throw new Error("닫는 괄호가 필요합니다.");
      return value;
    }

    if (t.type === "name") {
      pos++;
      const name = t.value;

      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;

      const allowed = ["sqrt", "sin", "cos", "tan", "log", "ln"];

      if (!allowed.includes(name)) {
        throw new Error("지원하지 않는 함수: " + name);
      }

      let a;

      if (take("(")) {
        a = expression();
        if (!take(")")) throw new Error("함수 괄호가 닫히지 않았습니다.");
      } else {
        a = unary();
      }

      if (name === "sqrt") {
        if (a < 0) throw new Error("음수의 제곱근은 실수 범위에서 계산할 수 없습니다.");
        return Math.sqrt(a);
      }

      if (name === "sin") return Math.sin(a * Math.PI / 180);
      if (name === "cos") return Math.cos(a * Math.PI / 180);
      if (name === "tan") return Math.tan(a * Math.PI / 180);

      if (name === "log") {
        if (a <= 0) throw new Error("로그의 입력값은 0보다 커야 합니다.");
        return Math.log10(a);
      }

      if (name === "ln") {
        if (a <= 0) throw new Error("자연로그의 입력값은 0보다 커야 합니다.");
        return Math.log(a);
      }
    }

    throw new Error("수식의 순서를 확인해 주세요.");
  }

  const result = expression();

  if (pos !== tokens.length) {
    throw new Error("연산자나 괄호의 위치를 확인해 주세요.");
  }

  if (!Number.isFinite(result)) {
    throw new Error("유효한 실수 결과가 아닙니다.");
  }

  return result;
}

// 일반 수식 계산 버튼
form.addEventListener("submit", function(event) {
  event.preventDefault();

  try {
    const original = input.value.trim();
    if (!original) throw new Error("수식을 입력해 주세요.");

    const normalized = prepareExpression(original);
    const tokens = tokenize(normalized);
    const value = calculateExpression(tokens);

    statusText.textContent = "계산 완료";
    formulaText.textContent = "변환한 수식: " + normalized;
    answerText.textContent =
      "결과: " + Number(value.toPrecision(12)).toString();

  } catch (error) {
    statusText.textContent = "계산할 수 없습니다.";
    formulaText.textContent = error.message;
    answerText.textContent = "";
  }
});

// AI 공학 문제 풀이 버튼
aiButton.addEventListener("click", async function() {
  const question = input.value.trim();

  if (!question) {
    statusText.textContent = "질문을 입력해 주세요.";
    formulaText.textContent = "";
    answerText.textContent = "";
    input.focus();
    return;
  }

  aiButton.disabled = true;
  aiButton.textContent = "AI가 풀이 중...";
  statusText.textContent = "AI에 질문을 보내고 있습니다.";
  formulaText.textContent = "";
  answerText.textContent = "";

  try {
    const response = await fetch(AI_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error || "AI 요청에 실패했습니다. 잠시 후 다시 시도해 주세요."
      );
    }

    if (!data.answer) {
      throw new Error("AI가 답변을 반환하지 않았습니다.");
    }

    statusText.textContent = "AI 풀이 완료";
    formulaText.textContent = "질문: " + question;
    answerText.textContent = data.answer;

  } catch (error) {
    statusText.textContent = "AI 요청 실패";
    formulaText.textContent = "";
    answerText.textContent =
      error.name === "TypeError"
        ? "서버에 연결하지 못했습니다. Worker 주소와 배포 상태를 확인해 주세요."
        : error.message;
  } finally {
    aiButton.disabled = false;
    aiButton.textContent = "AI로 공학 문제 풀이";
  }
});
</script>
</body>
</html>
