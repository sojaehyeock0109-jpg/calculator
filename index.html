      },

        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]

  <style>

    :root {
      --blue: #2563eb;
      --purple: #6d28d9;
      --bg: #f2f5fb;
      --border: #dbe2ec;
      --muted: #64748b;
      --text: #172033;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .layout {
      width: 100%;

      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 0.92fr) minmax(420px, 1.08fr);
      align-items: start;
      gap: 22px;
    }

    .panel {
      min-width: 0;
      padding: 24px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 6px 24px #1720330a;
    }

    h1 { font-size: 26px; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 0 0 10px; }

    p { line-height: 1.65; }

    .subtext {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: var(--text);
      background: white;
    }

    input:focus, textarea:focus {

      border-color: var(--blue);

      border-radius: 9px;
      padding: 12px 14px;
      transition: background 0.15s, transform 0.05s;

    button:active { transform: scale(0.98); }

    .primary {
      color: white;
      background: var(--blue);
    }

    .primary:hover { background: #1d4ed8; }

    .ai-button {

      background: #e9eef6;
    }

      border-radius: 12px;

      border: 0;
      outline: none;
      box-shadow: none;
      font-size: 21px;
      line-height: 1.7;

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .editor-actions button { min-width: 0; }

    .keyboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 12px;
    }

    .tabs, .angle-modes {
      display: flex;
      gap: 5px;
    }

    .tab {
      padding: 9px 12px;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
    }

    .tab.active {
      color: var(--blue);
      background: #eff6ff;
      font-weight: 700;
    }

    .angle {
      padding: 8px 10px;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
    }

    .angle.active {
      color: white;
      background: #475569;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .key {
      min-width: 0;
      min-height: 46px;
      padding: 8px 3px;
      background: #edf1f7;
      color: #1e293b;
      border: 1px solid #dce3ed;
      font-size: 17px;
    }

    .key:hover { background: #dfe8f5; }

    .key.operator {
      color: #1d4ed8;
      background: #e8f0ff;
    }

    .key.function {
      background: #f1eafe;
      color: #6d28d9;
    }

    .key.utility {
      background: #dce5f2;
      font-weight: 700;
    }

    .keyboard-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

    .key-hint {
      margin-top: 14px;

      background: #f8fafc;

<script>

function renderKeys(tab) {
  keyGrid.replaceChildren();

  for (const key of keyLayouts[tab]) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "key" + (key.cls ? " " + key.cls : "");
    button.textContent = key.label;
    button.addEventListener("click", () => {
      insertAtCursor(key.value, key.caret);
    });
    keyGrid.appendChild(button);
  }

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
}

function insertAtCursor(text, caretOffset) {
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? editor.value.length;

  editor.setRangeText(text, start, end, "end");

  const caret = start + (
    Number.isInteger(caretOffset) ? caretOffset : text.length
  );

  editor.focus();
  editor.setSelectionRange(caret, caret);
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    renderKeys(button.dataset.tab);
  });
});

document.getElementById("clearButton").addEventListener("click", () => {
  editor.value = "";
  editor.focus();
});

document.getElementById("backspaceButton").addEventListener("click", () => {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;

  if (start !== end) {
    editor.setRangeText("", start, end, "end");
  } else if (start > 0) {
    editor.setRangeText("", start - 1, end, "end");
  }

  editor.focus();
});

  document.getElementById("degButton").classList.add("active");

document.getElementById("radButton").addEventListener("click", () => {

// 한국어 수학 표현을 계산 가능한 수식으로 변환합니다.
function prepareExpression(raw) {
  if (raw.length > 300) {
    throw new Error("수식은 300자 이하로 입력해 주세요.");
  }

  let s = raw.toLowerCase()
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-");

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*(\d+(?:\.\d+)?)\s*제곱/g,
    "($1^$2)"
  );

  s = s.replace(
    /(\d+(?:\.\d+)?)\s*의\s*세제곱/g,
    "($1^3)"
  );

  s = s.replace(
    /(\d+(?:\.\d*)?|\.\d+)\s*분의\s*(\d+(?:\.\d*)?|\.\d+)/g,
    "($2/$1)"
  );

  const replacements = [
    ["자연로그", "ln"],
    ["제곱근", "sqrt"],
    ["코사인", "cos"],
    ["탄젠트", "tan"],
    ["사인", "sin"],
    ["세제곱", "^3"],
    ["제곱", "^2"],
    ["루트", "sqrt"],
    ["로그", "log"],
    ["파이", "pi"],
    ["더하기", "+"],
    ["플러스", "+"],
    ["빼기", "-"],
    ["마이너스", "-"],
    ["곱하기", "*"],
    ["나누기", "/"],
    ["의", ""],
    ["도", ""]
  ];

  for (const [word, replacement] of replacements) {
    s = s.split(word).join(replacement);
  }

  return s.trim();
}

function tokenize(s) {
  const tokens = [];
  let i = 0;

  while (i < s.length) {
    if (/\s/.test(s[i])) {
      i++;
      continue;
    }

    const rest = s.slice(i);
    const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);

    if (number) {
      tokens.push({type: "number", value: Number(number[0])});
      i += number[0].length;
      continue;
    }

    const name = rest.match(/^[a-z]+/);

    if (name) {
      tokens.push({type: "name", value: name[0]});
      i += name[0].length;
      continue;
    }

    if ("+-*/^()".includes(s[i])) {
      tokens.push({type: "symbol", value: s[i]});
      i++;
      continue;
    }

    throw new Error("인식할 수 없는 문자: " + s[i]);
  }

  if (!tokens.length) throw new Error("수식을 입력해 주세요.");
  if (tokens.length > 150) throw new Error("수식이 너무 복잡합니다.");

  return tokens;
}

function calculateExpression(tokens) {
  let pos = 0;

  function peek() {
    return tokens[pos];
  }

  function take(value) {
    if (peek() && peek().value === value) {
      pos++;
      return true;
    }
    return false;
  }

  function expression() {
    let value = term();

    while (peek() && ["+", "-"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const right = term();
      value = op === "+" ? value + right : value - right;
    }

    return value;
  }

  function term() {
    let value = unary();

    while (peek() && ["*", "/"].includes(peek().value)) {
      const op = tokens[pos++].value;
      const right = unary();

      if (op === "/" && right === 0) {
        throw new Error("0으로 나눌 수 없습니다.");
      }

      value = op === "*" ? value * right : value / right;
    }

    return value;
  }

  function unary() {
    if (take("+")) return unary();
    if (take("-")) return -unary();
    return power();
  }

  function power() {
    const base = primary();

    if (take("^")) {
      return Math.pow(base, unary());
    }

    return base;
  }

  function primary() {
    const t = peek();

    if (!t) throw new Error("수식이 완성되지 않았습니다.");

    if (t.type === "number") {
      pos++;
      return t.value;
    }

    if (take("(")) {
      const value = expression();
      if (!take(")")) throw new Error("닫는 괄호가 필요합니다.");
      return value;
    }

    if (t.type === "name") {
      pos++;
      const name = t.value;

      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;

      const allowed = ["sqrt", "sin", "cos", "tan", "log", "ln"];

      if (!allowed.includes(name)) {
        throw new Error("지원하지 않는 함수: " + name);
      }

      let a;

      if (take("(")) {
        a = expression();
        if (!take(")")) throw new Error("함수 괄호가 닫히지 않았습니다.");
      } else {
        a = unary();
      }

      if (name === "sqrt") {
        if (a < 0) throw new Error("음수의 제곱근은 실수 범위에서 계산할 수 없습니다.");
        return Math.sqrt(a);
      }

      const angle = angleMode === "deg" ? a * Math.PI / 180 : a;

      if (name === "sin") return Math.sin(angle);
      if (name === "cos") return Math.cos(angle);
      if (name === "tan") return Math.tan(angle);

      if (name === "log") {
        if (a <= 0) throw new Error("로그의 입력값은 0보다 커야 합니다.");
        return Math.log10(a);
      }

      if (a <= 0) throw new Error("자연로그의 입력값은 0보다 커야 합니다.");
      return Math.log(a);
    }

    throw new Error("수식의 순서를 확인해 주세요.");
  }

  const result = expression();

  if (pos !== tokens.length) {
    throw new Error("연산자나 괄호의 위치를 확인해 주세요.");
  }

  if (!Number.isFinite(result)) {
    throw new Error("유효한 실수 결과가 아닙니다.");
  }

  return result;
}

function setResultStatus(status, formula = "", answer = "") {
  statusText.textContent = status;
  formulaText.textContent = formula;
  answerText.textContent = answer;
}

calcForm.addEventListener("submit", function(event) {
  event.preventDefault();

  try {
    const original = input.value.trim();
    if (!original) throw new Error("수식을 입력해 주세요.");

    const normalized = prepareExpression(original);
    const value = calculateExpression(tokenize(normalized));

    setResultStatus(
      "계산 완료",
      "변환한 수식: " + normalized,
      "결과: " + Number(value.toPrecision(12)).toString()
    );
  } catch (error) {
    setResultStatus("계산할 수 없습니다.", error.message, "");
  }
});

// 왼쪽 수식을 오른쪽 입력창으로 옮깁니다.
function copyEditorToRight() {
  const expression = editor.value.trim();

  if (!expression) {
    setResultStatus("수식을 입력해 주세요.", "", "");
    editor.focus();
    return false;
  }

  input.value = expression;
  return true;
}

localFromEditor.addEventListener("click", () => {
  if (copyEditorToRight()) {
    calcForm.requestSubmit();
  }
});

aiFromEditor.addEventListener("click", () => {
  if (copyEditorToRight()) {
    aiButton.click();
  }
});

function renderMath() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    return window.MathJax.typesetPromise([answerText]);
  }

  return Promise.resolve();
}

aiButton.addEventListener("click", async function() {
  const question = input.value.trim();

  if (!question) {
    setResultStatus("질문을 입력해 주세요.");
    input.focus();
    return;
  }

  aiButton.disabled = true;
  aiFromEditor.disabled = true;
  aiButton.textContent = "AI가 풀이 중...";
  setResultStatus("AI에 질문을 보내고 있습니다.");

  try {
    const response = await fetch(AI_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({question})
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || "AI 요청에 실패했습니다.");
    }

    if (!data.answer) {
      throw new Error("AI가 답변을 반환하지 않았습니다.");
    }

    if (window.MathJax && window.MathJax.typesetClear) {
      window.MathJax.typesetClear([answerText]);
    }

    statusText.textContent = "AI 풀이 완료";
    formulaText.textContent = "질문: " + question;
    answerText.textContent = data.answer;

    await renderMath();

  } catch (error) {
    if (window.MathJax && window.MathJax.typesetClear) {
      window.MathJax.typesetClear([answerText]);
    }

    setResultStatus(
      "AI 요청 실패",
      "",
      error.name === "TypeError"
        ? "서버에 연결하지 못했습니다. Worker 주소와 배포 상태를 확인해 주세요."
        : error.message
    );
  } finally {
    aiButton.disabled = false;
    aiFromEditor.disabled = false;
    aiButton.textContent = "AI로 공학 문제 풀이";
  }
});

// 기본 키패드 표시
renderKeys("main");
</script>
