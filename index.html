
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공학용 계산기</title>

<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"], ["$", "$"]],
    displayMath: [["\\[", "\\]"], ["$$", "$$"]]
  },
  chtml: { displayAlign: "left" }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: #f5f7fb;
  color: #172033;
  font-family: Arial, "Malgun Gothic", sans-serif;
}
.app {
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  align-items: stretch;
}
.panel {
  min-width: 0;
  min-height: 720px;
  padding: 20px;
  border: 1px solid #d6e2f4;
  border-radius: 18px;
  background: white;
}
h1 { font-size: 23px; margin: 0 0 8px; }
.subtitle { color: #64748b; font-size: 13px; line-height: 1.7; }
.screen {
  min-height: 125px;
  padding: 12px;
  border: 1px solid #d6e2f4;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}
#display {
  width: 100%;
  padding: 8px 0;
  border: 0;
  outline: 0;
  font-size: 24px;
  text-align: right;
  color: #172033;
}
#screenResult {
  text-align: right;
  color: #64748b;
  overflow-wrap: anywhere;
}
.mode-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
}
button { cursor: pointer; font: inherit; }
.mode {
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  background: #edf2fa;
  color: #475569;
}
.mode.active { background: #0866d9; color: white; }
#memoryStatus { font-size: 12px; color: #94a3b8; }
.keypad {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 7px;
}
.key {
  min-width: 0;
  min-height: 47px;
  padding: 6px 2px;
  border: 1px solid #d6e2f4;
  border-radius: 9px;
  background: #eff4fc;
  color: #172033;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.key.number { background: white; }
.key.function { background: #f0f5ff; }
.key.operator { background: #e8f0ff; }
.key.danger { background: #fff0f0; color: #dc2626; }
.key.equal {
  grid-column: span 3;
  background: #0866d9;
  color: white;
  font-size: 20px;
}
.history-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 15px;
  border-bottom: 1px solid #d6e2f4;
}
.history-heading h2 { font-size: 18px; margin: 0; }
.clear-history {
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: #edf2fa;
  color: #475569;
  font-size: 12px;
}
.latest {
  margin-top: 16px;
  padding: 15px;
  min-height: 150px;
  border: 1px solid #d6e2f4;
  border-radius: 12px;

  overflow: visible;
}
.latest-label, .history-expression {
  font-size: 12px;

}

.latest-answer, .history-answer {

}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
  max-height: 470px;

}
.history-item {
  padding: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: white;
  cursor: pointer;
}
.history-item:hover { background: #f8fbff; }
.empty {
  padding: 30px 10px;
  color: #94a3b8;
  text-align: center;
  font-size: 14px;
}
.help { margin-top: 14px; font-size: 12px; color: #64748b; line-height: 1.8; }
mjx-container { max-width: 100% !important; }
mjx-container[display="true"] {
  margin: .6em 0 !important;
  padding: .2em 0 .35em;
  overflow: visible !important;
}
@media(max-width: 900px) {
  body { padding: 10px; }

}

  .keypad { gap: 5px; }
  .key { min-height: 42px; font-size: 12px; }
  #display { font-size: 20px; }
}
</style>
</head>
<body>

<div class="app">
  <section class="panel">
    <h1>공학용 계산기</h1>
    <p class="subtitle">수식을 입력하거나 키패드를 사용하세요.</p>

    <div class="screen">
      <input id="display" autocomplete="off"
        placeholder="예: 이 더하기 삼, x²+4는 16">
      <div id="screenResult">계산 결과가 여기에 표시됩니다.</div>
    </div>

    <div class="mode-row">
      <div>
        <button class="mode active" id="degButton">Deg</button>
        <button class="mode" id="radButton">Rad</button>
      </div>
      <span id="memoryStatus">M: 비어 있음</span>
    </div>

    <div class="keypad" id="keypad"></div>

    <div class="help">
      한글 숫자와 일반 숫자를 모두 지원합니다.<br>
      예: 이 더하기 삼, 십 곱하기 삼, 오의 제곱, x세제곱은 8
    </div>
  </section>

  <section class="panel">
    <div class="history-heading">
      <h2>계산 기록</h2>
      <button class="clear-history" id="clearHistory">기록 지우기</button>
    </div>

    <div class="latest">
      <div class="latest-label">최근 계산 결과</div>
      <div class="latest-expression" id="latestExpression">
        계산 결과가 여기에 표시됩니다.
      </div>
      <div class="latest-answer" id="latestAnswer">
        왼쪽에서 계산을 시작하세요.
      </div>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty">계산 기록이 여기에 표시됩니다. (최대 10개)</div>
    </div>
  </section>
</div>

<script>
"use strict";

const display = document.getElementById("display");
const screenResult = document.getElementById("screenResult");
const latestExpression = document.getElementById("latestExpression");
const latestAnswer = document.getElementById("latestAnswer");
const historyList = document.getElementById("historyList");
const keypad = document.getElementById("keypad");
const memoryStatus = document.getElementById("memoryStatus");

let angleMode = "deg";
let memoryValue = null;
let lastAnswer = 0;
let history = [];

function formatNumber(n) {
  if (!Number.isFinite(n)) throw new Error("유효하지 않은 계산 결과입니다.");
  if (Math.abs(n) < 1e-12) return "0";
  return Number(n.toPrecision(10)).toString();
}

// 한글 숫자 변환
function koreanNumberToArabic(word) {
  const digits = {
    "영":0, "공":0, "일":1, "이":2, "삼":3,
    "사":4, "오":5, "육":6, "칠":7, "팔":8, "구":9
  };
  const units = {"십":10, "백":100, "천":1000};

  // 숫자 이름에 단위가 없으면 각 글자를 숫자로 읽습니다.
  if (![..."십백천"].some(ch => word.includes(ch))) {
    return [...word].map(ch => digits[ch]).join("");
  }

  let total = 0;
  let current = 0;
  let section = 0;

  for (const ch of word) {
    if (digits[ch] !== undefined) {
      current = digits[ch];
    } else if (units[ch]) {
      section += (current || 1) * units[ch];
      current = 0;

      if (units[ch] === 1000) {
        total += section;
        section = 0;
      }
    }
  }

  return String(total + section + current);
}

function normalizeExpression(raw) {
  let s = raw.trim().toLowerCase();

  if (s.length > 300) {
    throw new Error("수식은 300자 이하로 입력해 주세요.");
  }

  s = s
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/[−–]/g, "-")
    .replace(/²/g, "^2")
    .replace(/³/g, "^3");

  // 한글 숫자를 먼저 처리합니다.
  // 한글 단어 내부의 글자나 x 같은 미지수는 변환하지 않습니다.
  const numberWords = "[영공일이삼사오육칠팔구십백천]+";
  const operationWords =
    "더하기|빼기|곱하기|나누기|의|제곱|세제곱|은|는";

  const numberPattern = new RegExp(
    `(^|[\\s(])(${numberWords})(?=\\s*(?:${operationWords}|[=+*/^()\\-]|$))`,
    "g"
  );

  s = s.replace(numberPattern, (whole, prefix, word) => {
    return prefix + koreanNumberToArabic(word);
  });

  // 표현식에 사용되는 한글 연산어
  const replacements = [
    [/계산해\s*주세요/g, ""],
    [/계산해줘/g, ""],
    [/구해\s*주세요/g, ""],
    [/구해줘/g, ""],
    [/풀어\s*주세요/g, ""],
    [/풀어줘/g, ""],
    [/제곱근/g, "sqrt"],
    [/자연로그/g, "ln"],
    [/코사인/g, "cos"],
    [/탄젠트/g, "tan"],
    [/사인/g, "sin"],
    [/루트/g, "sqrt"],
    [/로그/g, "log"],
    [/파이/g, "pi"],
    [/더하기/g, "+"],
    [/곱하기/g, "*"],
    [/나누기/g, "/"],
    [/빼기/g, "-"],
    [/플러스/g, "+"],
    [/마이너스/g, "-"],
    [/세제곱/g, "^3"],
    [/제곱/g, "^2"]
  ];

  for (const [pattern, replacement] of replacements) {
    s = s.replace(pattern, replacement);
  }

  // "은", "는"을 등호로 취급합니다.
  s = s.replace(/은/g, "=").replace(/는/g, "=");

  // "2의3제곱"과 "x의2제곱"을 지원합니다.
  s = s.replace(
    /([0-9a-zA-Z_]+)\s*의\s*([0-9]+)\s*제곱/g,
    "($1^$2)"
  );

  // 공백으로 입력한 함수 인자
  s = s.replace(
    /\b(sqrt|sin|cos|tan|asin|acos|atan|log|ln|abs|floor|ceil|round)\s+([+-]?\d+(?:\.\d+)?)/g,
    "$1($2)"
  );

  return s.trim();
}

function gcd(a, b) {
  a = Math.abs(Math.round(a));
  b = Math.abs(Math.round(b));
  while (b) [a, b] = [b, a % b];
  return a || 1;
}

function simplifiedRoot(n) {
  let inside = Math.round(n);
  let outside = 1;

  for (let i = 2; i * i <= inside; i++) {
    while (inside % (i * i) === 0) {
      inside /= i * i;
      outside *= i;
    }
  }

  return {inside, outside};
}

function solveEquation(expr) {
  if ((expr.match(/=/g) || []).length !== 1) {
    throw new Error("등호 하나로 방정식을 입력해 주세요.");
  }

  const [left, right] = expr.split("=").map(s => s.trim());
  const residual = `(${left})-(${right})`;

  const names = [...new Set(
    (left + " " + right).match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || []
  )].filter(name => ![
    "sqrt", "sin", "cos", "tan", "asin", "acos", "atan",
    "log", "ln", "abs", "floor", "ceil", "round", "pi", "e"
  ].includes(name));

  if (names.length !== 1) {
    throw new Error("현재는 미지수 하나인 방정식을 지원합니다.");
  }

  const variable = names[0];

  let coeffs;
  try {
    const vector = nerdamer.coeffs(
      nerdamer(residual).expand().toString(), variable
    );

    coeffs = [];
    vector.each((item, index) => {
      coeffs[index] = Number(
        nerdamer(String(item)).evaluate().text("decimals")
      );
    });
  } catch {
    coeffs = null;
  }

  if (coeffs && coeffs.length <= 3) {
    while (coeffs.length > 1 && Math.abs(coeffs.at(-1)) < 1e-10) {
      coeffs.pop();
    }

    if (coeffs.length === 1) {
      return {
        answer: Math.abs(coeffs[0]) < 1e-10
          ? "항등식입니다."
          : "해가 없습니다."
      };
    }

    if (coeffs.length === 2) {
      const root = -coeffs[0] / coeffs[1];
      return {
        answer: `실수 해:\n\\[${variable} = ${formatNumber(root)}\\]`
      };
    }

    if (coeffs.length === 3) {
      const [c, b, a] = coeffs;
      const D = b*b - 4*a*c;
      const denominator = 2*a;

      if (D < -1e-10) {
        const real = -b / denominator;
        const imag = Math.sqrt(-D) / Math.abs(denominator);

        if (Math.abs(real) < 1e-10) {
          return {
            answer:
              `복소수 해:\n\\[${variable} = \\pm ${formatNumber(imag)}i\\]`
          };
        }

        return {
          answer:
            `복소수 해:\n` +
            `\\[${variable} = ${formatNumber(real)}+${formatNumber(imag)}i\\]\n` +
            `\\[${variable} = ${formatNumber(real)}-${formatNumber(imag)}i\\]`
        };
      }

      if (Math.abs(D) < 1e-10) {
        return {
          answer: `실수 해:\n\\[${variable} = ${formatNumber(-b/denominator)}\\]`
        };
      }

      const sqrtD = Math.sqrt(D);
      const x1 = (-b + sqrtD) / denominator;
      const x2 = (-b - sqrtD) / denominator;
      const roots = Math.abs(x1-x2) < 1e-10 ? [x1] : [x1,x2];

      // 정수 계수와 정수 판별식일 때 근호를 단순화합니다.
      const integerCoeffs = [a,b,c,D].every(
        n => Math.abs(n-Math.round(n)) < 1e-8
      );

      if (integerCoeffs) {
        const ai = Math.round(a);
        const bi = Math.round(b);
        const di = Math.round(D);
        const sd = Math.round(Math.sqrt(di));

        if (sd*sd === di) {
          return {
            answer: "실수 해:\n" + roots.map(x =>
              `\\[${variable} = ${formatNumber(x)}\\]`
            ).join("\n")
          };
        }

        const r = simplifiedRoot(di);
        let num = -bi;
        let radicalCoefficient = r.outside;
        let den = 2*ai;

        if (den < 0) {
          num = -num;
          den = -den;
        }

        const common = gcd(gcd(num, radicalCoefficient), den);
        num /= common;
        radicalCoefficient /= common;
        den /= common;

        const radical =
          (radicalCoefficient === 1 ? "" : radicalCoefficient) +
          `\\sqrt{${r.inside}}`;

        let numerator;
        if (num === 0) {
          numerator = `\\pm ${radical}`;
        } else {
          numerator =
            `${num < 0 ? "-" : ""}${Math.abs(num)} \\pm ${radical}`;
        }

        const exact = den === 1
          ? numerator
          : `\\frac{${numerator}}{${den}}`;

        return {
          answer:
            `정확한 해:\n\\[${variable} = ${exact}\\]\n\n` +
            `소수 근삿값:\n` +
            roots.map(x =>
              `\\[${variable} \\approx ${formatNumber(x)}\\]`
            ).join("\n")
        };
      }

      return {
        answer: "실수 해:\n" + roots.map(x =>
          `\\[${variable} \\approx ${formatNumber(x)}\\]`
        ).join("\n")
      };
    }
  }

  // 3차 이상은 기호 계산 엔진으로 풀이합니다.
  const solution = nerdamer.solve(residual, variable).toString();
  const roots = solution
    .replace(/^\[/, "")
    .replace(/\]$/, "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  if (!roots.length) throw new Error("해를 구하지 못했습니다.");

  return {
    answer: "해:\n" + roots.map(root =>
      `\\[${variable} = ${nerdamer(root).toTeX()}\\]`
    ).join("\n")
  };
}

function prepareTrig(expr) {
  if (angleMode === "rad") return expr;

  return expr.replace(/\b(sin|cos|tan)\(([^()]*)\)/g,
    (whole, fn, arg) => {
      if (/^[0-9.+\-*/\s]+$/.test(arg)) {
        return `${fn}((${arg})*pi/180)`;
      }
      return whole;
    }
  );
}

function calculate(raw) {
  const expr = normalizeExpression(raw);

  if (!expr) throw new Error("수식을 입력해 주세요.");

  if (expr.includes("=")) {
    return {expr, ...solveEquation(expr)};
  }

  if (!/^[0-9a-zA-Z_+\-*/^().,\s]+$/.test(expr)) {
    throw new Error("지원하지 않는 문자가 포함되어 있습니다.");
  }

  const value = Number(
    nerdamer(prepareTrig(expr)).evaluate().text("decimals")
  );

  if (!Number.isFinite(value)) {
    throw new Error("계산할 수 없는 수식입니다.");
  }

  return {
    expr,
    value,
    answer: `\\[${expr.replace(/\*/g, " \\times ")} = ${formatNumber(value)}\\]`
  };
}

async function typeset(element) {
  if (!window.MathJax?.typesetPromise) return;

  try {
    MathJax.typesetClear?.([element]);
    await MathJax.typesetPromise([element]);
  } catch {}
}

function addHistory(expr, answer) {
  history.unshift({expr, answer});
  history = history.slice(0, 10);
  historyList.replaceChildren();

  for (const item of history) {
    const card = document.createElement("div");
    card.className = "history-item";

    const expression = document.createElement("div");
    expression.className = "history-expression";
    expression.textContent = item.expr;

    const result = document.createElement("div");
    result.className = "history-answer";
    result.textContent = item.answer;

    card.append(expression, result);
    card.addEventListener("click", () => {
      display.value = item.expr;
      display.focus();
    });

    historyList.appendChild(card);
    typeset(result);
  }

  if (!history.length) {
    historyList.innerHTML =
      '<div class="empty">계산 기록이 없습니다.</div>';
  }
}

function calculateCurrent() {
  const raw = display.value.trim();

  try {
    const result = calculate(raw);
    const answer = result.answer;

    if (result.value !== undefined) lastAnswer = result.value;

    latestExpression.textContent = result.expr;
    latestAnswer.textContent = answer;
    screenResult.textContent = result.value !== undefined
      ? formatNumber(result.value)
      : "계산 완료";

    addHistory(result.expr, answer);
    typeset(latestAnswer);
  } catch (error) {
    latestExpression.textContent = raw;
    latestAnswer.textContent = error.message || "계산 오류";
    screenResult.textContent = "계산 오류";
    addHistory(raw, error.message || "계산 오류");
  }
}

function insertText(text) {
  const start = display.selectionStart ?? display.value.length;
  const end = display.selectionEnd ?? display.value.length;
  display.setRangeText(text, start, end, "end");
  display.focus();
}

const keys = [
  ["sin","sin(","function"], ["cos","cos(","function"],
  ["tan","tan(","function"], ["asin","asin(","function"],
  ["acos","acos(","function"], ["atan","atan(","function"],
  ["log","log(","function"], ["ln","ln(","function"],
  ["x²","^2","function"], ["x³","^3","function"],
  ["xʸ","^","function"], ["√x","sqrt(","function"],
  ["³√x","nthroot(","function"], ["10ˣ","10^(","function"],
  ["eˣ","e^(","function"], ["1/x","1/(","function"],
  ["abs","abs(","function"], ["π","pi","function"],
  ["M+","M+","utility"], ["M−","M-","utility"],
  ["MR","MR","utility"], ["e","e","function"],
  ["(","(","utility"], [")",")","utility"],
  ["7","7","number"], ["8","8","number"],
  ["9","9","number"], ["/","/","operator"],
  ["%","/100","operator"], ["^","^","operator"],
  ["4","4","number"], ["5","5","number"],
  ["6","6","number"], ["*","*","operator"],
  ["±","±","operator"], ["AC","AC","danger"],
  ["1","1","number"], ["2","2","number"],
  ["3","3","number"], ["-","-","operator"],
  ["Ans","Ans","operator"], ["C","C","danger"],
  ["0","0","number"], [".",".","number"],
  ["+","+","operator"], ["=","=","equal"]
];

for (const [label, value, cls] of keys) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "key " + cls;
  button.textContent = label;

  button.addEventListener("click", () => {
    if (value === "=") return calculateCurrent();

    if (value === "AC") {
      display.value = "";
      screenResult.textContent = "0";
      display.focus();
      return;
    }

    if (value === "C") {
      const start = display.selectionStart;
      const end = display.selectionEnd;

      if (start !== end) {
        display.setRangeText("", start, end, "end");
      } else if (start > 0) {
        display.setRangeText("", start - 1, end, "end");
      }

      display.focus();
      return;
    }

    if (value === "±") {
      display.value = display.value.startsWith("-(")
        ? display.value.slice(2, -1)
        : `-(${display.value})`;
      display.focus();
      return;
    }

    if (value === "Ans") return insertText(String(lastAnswer));

    if (value === "M+") return changeMemory(1);
    if (value === "M-") return changeMemory(-1);

    if (value === "MR") {
      if (memoryValue !== null) insertText(String(memoryValue));
      return;
    }

    insertText(value);
  });

  keypad.appendChild(button);
}

function changeMemory(sign) {
  try {
    const result = calculate(display.value);
    if (result.value === undefined) {
      throw new Error("메모리 기능은 숫자 계산에 사용하세요.");
    }

    memoryValue = (memoryValue || 0) + sign * result.value;
    memoryStatus.textContent = "M: " + formatNumber(memoryValue);
  } catch (error) {
    screenResult.textContent = error.message;
  }
}

document.getElementById("degButton").onclick = () => {
  angleMode = "deg";
  document.getElementById("degButton").classList.add("active");
  document.getElementById("radButton").classList.remove("active");
};

document.getElementById("radButton").onclick = () => {
  angleMode = "rad";
  document.getElementById("radButton").classList.add("active");
  document.getElementById("degButton").classList.remove("active");
};

document.getElementById("clearHistory").onclick = () => {
  history = [];
  historyList.innerHTML =
    '<div class="empty">계산 기록이 없습니다.</div>';
};

display.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    calculateCurrent();
  }
});
</script>
